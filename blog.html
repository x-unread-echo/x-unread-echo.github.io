<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>嘀咕</title>
<link rel="stylesheet" href="assets/style.css?v=82">
<style>
  body{background:#f2f2f5;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:#333;min-height:100vh}
  .moon{display:none !important}
  #envhint{display:none !important}
  svg.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

  /* ---------- 新版三栏：左导航 / 中间流 / 右栏 ---------- */
  .frame{max-width:1180px;margin:0 auto;display:flex;gap:24px;padding:0 16px 70px;align-items:flex-start}
  .navcol{width:230px;flex-shrink:0;position:sticky;top:0;height:100vh;padding-top:10px}
  .maincol{width:600px;flex-shrink:0;display:flex;flex-direction:column;gap:12px}
  .rightcol{flex:1;min-width:250px;display:flex;flex-direction:column;gap:12px}
  @media (max-width:1120px){ .rightcol{display:none} }
  @media (max-width:880px){ .frame{flex-direction:column} .navcol{width:100%;height:auto;position:static;padding:10px 0 0} .maincol{width:100%} .navlist{flex-direction:row !important;flex-wrap:wrap} }

  /* ---------- 左侧导航 ---------- */
  .logo{display:flex;align-items:center;gap:9px;padding:10px 14px;cursor:pointer;user-select:none}
  .logo b{font-size:24px;color:#ff8200;font-weight:800}
  .navsearch{margin:4px 14px 14px;display:flex;align-items:center;gap:8px;background:#fff;border-radius:999px;
    padding:9px 16px;color:#9a9a9a;font-size:13.5px;box-shadow:0 1px 3px rgba(0,0,0,.05);cursor:text}
  .navlist{display:flex;flex-direction:column;gap:2px}
  .nitem{display:flex;align-items:center;gap:14px;padding:12px 18px;border-radius:999px;font-size:16px;color:#333;
    cursor:pointer;transition:background .15s}
  .nitem:hover{background:#e9e9ec}
  .nitem.on{color:#ff8200;font-weight:700}
  .nitem.on svg.ic{stroke:#ff8200}

  /* ---------- 卡片 ---------- */
  .card{background:#fff;border-radius:14px;box-shadow:0 1px 4px rgba(0,0,0,.05)}
  .card .ch{padding:14px 18px;font-size:15px;font-weight:700;display:flex;justify-content:space-between;align-items:baseline}
  .card .ch small{font-size:11.5px;color:#b8b8b8;font-weight:400}

  /* ---------- 发帖框 ---------- */
  .compose{display:flex;gap:12px;padding:16px 18px;align-items:flex-start}
  .resume{display:flex;align-items:center;gap:12px;padding:12px 18px;font-size:13px;color:#7a6a55}
  .resume .rgo{margin-left:auto;background:#eb7350;color:#fff;border:none;border-radius:18px;
    padding:7px 18px;font-size:13px;letter-spacing:1px;cursor:pointer;transition:all .2s}
  .resume .rgo:hover{background:#d95f3c;transform:translateY(-1px)}
  .compose .cava{width:44px;height:44px;border-radius:50%;overflow:hidden;flex-shrink:0;cursor:zoom-in}
  .compose .cava img{width:100%;height:100%;object-fit:cover}
  .cright{flex:1}
  .cinput{background:#f2f2f5;border-radius:10px;padding:12px 14px;font-size:14.5px;color:#9a9a9a;cursor:text}
  .ctools{display:flex;align-items:center;gap:16px;margin-top:12px;padding:0 4px}
  .ctools span{color:#8a8a8a;cursor:pointer;display:flex}
  .ctools span:hover{color:#ff8200}
  .cbtn{margin-left:auto;background:#ff8200;color:#fff;border:none;border-radius:999px;padding:8px 20px;
    font-size:13.5px;cursor:pointer;font-weight:600}
  .cbtn:hover{background:#f07600}
  .cnote{font-size:11.5px;color:#b8b8b8;margin-top:8px;min-height:1.4em}

  /* ---------- 个人主页卡（右栏） ---------- */
  .pcov{height:88px;background:linear-gradient(120deg,#3c4a58,#6a7d8e);border-radius:14px 14px 0 0;position:relative;overflow:hidden}
  .pcov svg{position:absolute;right:16px;top:14px;width:56px;opacity:.16}
  .pava{width:72px;height:72px;border-radius:8px;border:3px solid #fff;margin:-42px 0 0 16px;background:#fff;
    box-shadow:0 2px 8px rgba(0,0,0,.15);overflow:hidden;cursor:zoom-in;position:relative;z-index:1}
  .pava img{width:100%;height:100%;object-fit:cover}
  .pbody{padding:8px 18px 16px}
  .pname{font-size:17px;font-weight:700}
  .pstats{display:flex;gap:26px;margin:10px 0 8px}
  .pstats b{display:block;font-size:15px}
  .pstats span{font-size:12px;color:#808080}
  .pdesc{font-size:12.5px;color:#808080;line-height:1.9}
  .pvisit{margin-top:9px;padding-top:9px;border-top:1px solid #f2f2f2;font-size:12px;color:#808080}
  .pvisit i{font-style:normal;color:#333}

  /* 热搜 */
  .hot .hi{display:flex;gap:8px;align-items:center;padding:8px 18px;font-size:13.5px;color:#333;cursor:pointer}
  .hot .hi:hover{color:#ff8200}
  .hot .hi b{color:#e35c5c;font-size:11px;font-style:normal;flex-shrink:0}
  .hot .hi small{margin-left:auto;color:#bbb;font-size:11px}

  /* 关注 / 音乐 */
  .fu{display:flex;gap:10px;align-items:center;padding:9px 18px;cursor:pointer}
  .fu:hover{background:#fafafa}
  .fu .fa{width:38px;height:38px;border-radius:8px;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:15px;font-weight:700}
  .fu .fn{font-size:13.5px;font-weight:600}
  .fu:hover .fn{color:#ff8200}
  .fu .fd{font-size:11.5px;color:#999;margin-top:1px}
  .fuempty{padding:14px 18px;font-size:12.5px;color:#999;line-height:1.9}
  .mus{display:flex;gap:10px;align-items:center;padding:10px 18px;cursor:pointer}
  .mus:hover{background:#fafafa}
  .mus .mi{width:36px;height:36px;border-radius:8px;background:linear-gradient(135deg,#ff9d3c,#ff8200);display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .mus .mi svg{width:15px;height:15px;fill:#fff}
  .mus .mt{font-size:13.5px;font-weight:600}
  .mus:hover .mt{color:#ff8200}
  .mus .md{font-size:11.5px;color:#999;margin-top:1px}

  /* ---------- 一条嘀咕 ---------- */
  .wb{padding:16px 18px 6px}
  .wb + .wb{border-top:1px solid #f5f5f5}
  .wbhead{display:flex;gap:12px}
  .wb .wa{width:44px;height:44px;border-radius:50%;overflow:hidden;flex-shrink:0;border:1px solid #f0f0f0;cursor:zoom-in}
  .wb .wa img{width:100%;height:100%;object-fit:cover}
  .wbmeta{flex:1;min-width:0}
  .wnamerow{display:flex;align-items:center;gap:8px}
  .wname{font-size:15px;font-weight:700;color:#333;cursor:pointer}
  .wname:hover{color:#ff8200}
  .wlock{font-size:11px;color:#b8b8b8;border:1px solid #e8e8e8;border-radius:4px;padding:0 5px;background:#fafafa}
  .wtime{font-size:12px;color:#9a9a9a;margin-top:2px}
  .wtext{font-size:15px;line-height:1.85;margin-top:8px;white-space:pre-line;word-break:break-all;color:#333}
  .wtext .deep{color:#eb735;cursor:pointer}
  .wtext .deep:hover{text-decoration:underline}
  .wtext .code{color:#eb735}
  .wtext .code.go{cursor:pointer;border-bottom:1px dashed #eb735}
  .wfold{max-height:126px;overflow:hidden;position:relative}
  .wfold::after{content:"";position:absolute;left:0;right:0;bottom:0;height:56px;background:linear-gradient(180deg,rgba(255,255,255,0),#fff)}
  .wmore{color:#eb735;font-size:13.5px;cursor:pointer;display:inline-block;margin-top:2px}
  .wmore:hover{text-decoration:underline}

  /* 操作栏：新版胶囊 hover */
  .wacts{display:flex;gap:4px;margin-top:10px;border-top:1px solid #f5f5f5;padding-top:6px}
  .wacts span{flex:1;display:flex;align-items:center;justify-content:center;gap:7px;padding:8px 0;
    font-size:13px;color:#808080;border-radius:999px;cursor:pointer;transition:all .15s}
  .wacts span:hover{color:#ff8200;background:#fff4e8}
  .wacts span.on{color:#ff8200;background:#fff4e8}
  .wacts svg{width:17px;height:17px}

  /* 评论区 */
  .wcmts{background:#f7f8fa;border-radius:10px;margin-top:8px;padding:10px 14px;display:none}
  .wcmts.show{display:block}
  .wcmt{display:flex;gap:9px;padding:8px 0;border-bottom:1px dashed #ececec;font-size:13.5px;line-height:1.8}
  .wcmt:last-of-type{border-bottom:none}
  .wcmt .ca{width:28px;height:28px;border-radius:50%;overflow:hidden;flex-shrink:0}
  .wcmt .ca img{width:100%;height:100%;object-fit:cover}
  .wcmt b{color:#eb735;font-weight:600}
  .wcmt.none{color:#999;font-size:12.5px;border:none;padding:4px 0}
  .wcinput{display:flex;gap:8px;margin-top:8px}
  .wcinput input{flex:1;border:1px solid #e5e5e5;border-radius:8px;padding:8px 12px;font-size:13px;outline:none;font-family:inherit;color:#333;background:#fff}
  .wcinput input:focus{border-color:#ff8200}
  .wcinput button{border:none;background:#ff8200;color:#fff;border-radius:8px;padding:0 16px;font-size:13px;cursor:pointer}
  .wcinput button:hover{background:#f07600}
  .wcnote{font-size:11.5px;color:#999;margin-top:6px;min-height:1.5em}

  .foot{font-size:12px;color:#9a9a9a;padding:10px 6px;line-height:2}
  .foot a{color:#507daf;text-decoration:none;margin-right:10px;cursor:pointer}

  .lbx{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;z-index:99;cursor:zoom-out}
  .lbx img{max-width:80vw;max-height:80vh;border-radius:8px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
  .lbx.show{display:flex}

  /* 弹出小提示卡 */
  .npop{position:fixed;left:246px;bottom:26px;max-width:360px;background:#fff;border-radius:14px;
    box-shadow:0 8px 30px rgba(0,0,0,.16);padding:14px 18px;font-size:13.5px;line-height:1.9;color:#333;
    z-index:60;opacity:0;transform:translateY(8px);transition:all .25s;pointer-events:none}
  .npop.show{opacity:1;transform:none}
  @media (max-width:880px){.npop{left:16px;right:16px;max-width:none}}
  /* 搜索结果条 */
  .nr{padding:9px 16px;font-size:13px;line-height:1.8;cursor:pointer;border-radius:8px}
  .nr:hover{background:#f7f7f9}
  .nr b{color:#333;font-size:13.5px}
  /* 热榜卡片高亮 */
  .flash{animation:hotflash 1.2s ease 2}
  @keyframes hotflash{0%,100%{box-shadow:0 1px 4px rgba(0,0,0,.05)}50%{box-shadow:0 0 0 3px rgba(255,130,0,.4)}}
  /* 陌生人评论：已注销 */
  .wcmt b.gone{text-decoration:line-through;color:#9a9a9a}
  .gtag{font-size:10.5px;color:#bbb;border:1px solid #e8e8e8;border-radius:4px;padding:0 4px;margin-left:6px;background:#fafafa}
  .gava{width:28px;height:28px;border-radius:50%;background:#d8dde3;color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0}
  .wcmt .dlink{color:#eb735;cursor:pointer;border-bottom:1px dashed #eb735}
</style>
</head>
<body>
<div class="moon"></div>

<div class="frame">

  <!-- 左侧竖排导航 -->
  <div class="navcol">
    <div class="logo">
      <svg width="30" height="30" viewBox="0 0 26 26"><path d="M13 2 C6.4 2, 1.5 6.6, 1.5 12.2 C1.5 15.4, 3.1 18.2, 5.7 20.1 L4.8 24 L9.2 21.6 C10.4 21.9, 11.7 22.1, 13 22.1 C19.6 22.1, 24.5 17.6, 24.5 12.2 C24.5 6.6, 19.6 2, 13 2 Z" fill="#ff8200"/><circle cx="9.2" cy="12.4" r="1.7" fill="#fff"/><circle cx="16.8" cy="12.4" r="1.7" fill="#fff"/></svg>
      <b>嘀咕</b>
    </div>
    <div class="navsearch" id="navsearch"><svg class="ic" style="width:16px;height:16px" viewBox="0 0 24 24"><path d="M10.5 3a7.5 7.5 0 1 0 4.6 13.4l4.7 4.7 1.4-1.4-4.7-4.7A7.5 7.5 0 0 0 10.5 3zm0 2a5.5 5.5 0 1 1 0 11 5.5 5.5 0 0 1 0-11z"/></svg><span id="nsPlaceholder">搜索</span><input id="nsInput" style="display:none;border:none;outline:none;flex:1;font-size:13.5px;background:transparent;color:#333;font-family:inherit" maxlength="20"></div>
    <div id="nsResult" style="display:none;background:#fff;border-radius:12px;box-shadow:0 4px 16px rgba(0,0,0,.10);margin:0 14px 10px;padding:4px 0"></div>
    <div class="navlist">
      <div class="nitem on" data-nav="home"><svg class="ic" viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v9a1 1 0 0 1-1 1h-5v-6h-4v6H5a1 1 0 0 1-1-1v-9z"/></svg>首页</div>
      <div class="nitem" data-nav="video"><svg class="ic" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M10 9.5l5 2.5-5 2.5v-5z"/></svg>视频</div>
      <div class="nitem" data-nav="find"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3.2"/><path d="M17 7l1.8-1.8"/></svg>发现</div>
      <div class="nitem" data-nav="msg"><svg class="ic" viewBox="0 0 24 24"><path d="M12 3a6 6 0 0 0-6 6v4l-2 3v1h16v-1l-2-3V9a6 6 0 0 0-6-6z"/><path d="M10 19a2 2 0 0 0 4 0"/></svg>消息</div>
      <div class="nitem" data-nav="hot"><svg class="ic" viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-8M22 20H2"/></svg>热榜</div>
    </div>
  </div>

  <!-- 中间：发帖框 + 信息流 -->
  <div class="maincol">
    <div class="card">
      <div class="compose">
        <div class="cava" data-lb="c"><img src="assets/media/butterfly.png" alt=""></div>
        <div class="cright">
          <div class="cinput" id="cinput">既然没人看，就随便说说……</div>
          <div class="ctools">
            <span><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8.5 10h.01M15.5 10h.01M8.5 14.5s1.2 1.5 3.5 1.5 3.5-1.5 3.5-1.5"/></svg></span>
            <span><svg class="ic" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="M4 18l5-5 4 4 3-3 4 4"/></svg></span>
            <span><svg class="ic" viewBox="0 0 24 24"><rect x="3" y="6" width="13" height="12" rx="2"/><path d="M16 10l5-3v10l-5-3"/></svg></span>
            <span><svg class="ic" viewBox="0 0 24 24"><path d="M12 4v10M12 20v-2M5 12h14M5 12l3-3M5 12l3 3M19 12l-3-3M19 12l-3 3"/></svg></span>
            <button class="cbtn" id="composeBtn">发嘀咕</button>
          </div>
          <div class="cnote" id="composeNote"></div>
        </div>
      </div>

    <div class="card resume" id="resume" style="display:none"></div>

    <div class="card" id="feed"></div>

    <div class="foot">
      <a data-foot="about">关于嘀咕</a><a data-foot="rule">嘀咕公约</a><a data-foot="fb">意见反馈</a><br>
      这个号没有告诉过任何人。包括<span style="color:#eb735">你</span>。
    </div>
  </div>

  <!-- 右栏 -->
  <div class="rightcol">
    <div class="card">
      <div class="pcov"><svg viewBox="0 0 60 48" fill="none"><path d="M30 24 C18 4, 2 6, 6 18 C9 27, 20 28, 30 24 Z" fill="#fff"/><path d="M30 24 C42 4, 58 6, 54 18 C51 27, 40 28, 30 24 Z" fill="#fff"/></svg></div>
      <div class="pava" id="avatar"><img src="assets/media/butterfly.png" alt=""></div>
      <div class="pbody">
        <div class="pname">北屋</div>
        <div class="pstats">
          <div><b>3</b><span>关注</span></div>

          <div id="postnum"><b>–</b><span>嘀咕</span></div>

    <div class="card" id="fuPanel">
      <div class="ch">他的关注</div>
      <div id="follows"></div>
    </div>

    <div class="card">
      <div class="ch">他分享的音乐</div>
      <div id="songs"></div>
    </div>
  </div>
</div>

<div class="npop" id="npop"></div>
<div class="lbx" id="lbx"><img id="lbximg" src="" alt=""></div>

<script src="assets/game.js?v=82"></script>
<script>
if (DJ.gate(1)) main();
function main(){
  const $ = id => document.getElementById(id);
  const ch = DJ.state.chapter;

  /* 继续走：从这里一步回到最近走到的那一站 */
  const RESUME = {1:"dial.html",2:"chat.html",3:"guanyun.html",4:"oracle.html",5:"forum.html",
                  6:"ledger.html",7:"adopt.html",8:"cloud.html",9:"mask.html",10:"archive.html",
                  11:"echo8.html",12:"final.html"};
  const RNAME = {1:"拨号",2:"未读",3:"青云观",4:"第八茶室",5:"倒影小组",6:"流水账",
                 7:"同城领养",8:"云屉网盘",9:"面具",10:"档案室",11:"镜中人",12:"终章"};
  if (ch >= 1 && RESUME[ch]){
    const rc = $("resume");
    rc.style.display = "flex";
    rc.innerHTML = `<span>上次看到「${RNAME[ch]}」</span><button class="rgo" id="rgo">继续走 →</button>`;
    $("rgo").onclick = () => { DJ.sfx.click(); location.href = RESUME[ch]; };
  }

  /* 搜搜热搜 */
  const HOT = [
    ["接电话之前先深呼吸", "2.1亿"],
    ["年度关键词是“等”", "1.4亿"],
    ["谁把声控灯修好了", "8763万"],
    ["搬去朝北的房子的人", "5102万"],
    ["凌晨三点你会打给谁", "4988万"]
  ];
  $("hot").innerHTML = HOT.map((h,i) =>
    `<div class="hi" data-q="${h[0]}"><b>${i===0?"热":"新"}</b>${h[0]}<small>${h[1]}</small></div>`
  ).join("");

  /* ---------- 右下角弹出卡：所有"点了会怎样"都从这里轻轻浮出来 ---------- */
  let popT = null;
  const pop = (html) => {
    const p = $("npop");
    p.innerHTML = html;
    p.classList.add("show");
    clearTimeout(popT);
    popT = setTimeout(() => p.classList.remove("show"), 4200);
  };

  /* ---------- 左导航：每一项都活着 ---------- */
  document.querySelectorAll(".nitem").forEach(n => {
    n.onclick = () => {
      DJ.sfx.click();
      const t = n.dataset.nav;
      if (t === "home"){
        document.querySelectorAll(".nitem").forEach(x => x.classList.remove("on"));
        n.classList.add("on");
        window.scrollTo({ top: 0, behavior: "smooth" });
      } else if (t === "video"){
        pop(`<b>视频</b><br>这个号没有发过视频。一条都没有。<br><span style="color:#999;font-size:12px">上传记录：1 条 · 状态：已删除 · 删除时间：2025-08-08 23:58</span>`);
      } else if (t === "find"){
        pop(`<b>发现</b><br>发现页是别人的热闹。他的发现页，四年没有刷新过。`);
      } else if (t === "msg"){
        pop(`<b>消息</b><br>私信 0 · 提及 0 · 评论提醒 0。<br>四年，一条都没有。系统都想不起来它。`);
      } else if (t === "hot"){
        const h = document.querySelector(".rightcol .hot");
        if (h){ h.scrollIntoView({ behavior:"smooth", block:"center" }); h.classList.remove("flash"); void h.offsetWidth; h.classList.add("flash"); }
        else pop(`<b>热榜</b><br>${HOT[0][0]} · ${HOT[0][1]}<br>${HOT[1][0]} · ${HOT[1][1]}<br><span style="color:#999;font-size:12px">他从来不上榜。上榜的那几次，话题都被秒删。</span>`);
      }
    };
  });

  /* ---------- 搜索框：真的能搜 ---------- */
  const SEARCH = [
    { kw:["存档","快照","拾光机"], html:`<div class="nr" data-go="snapshot.html"><b>拾光机 · 网页存档馆</b><br><span style="color:#999;font-size:12px">shiguangji.archive — 让消失的网页有地方可回</span></div>` },

  /* 转发 / 赞 */
  document.querySelectorAll(".wacts span").forEach(s => {
    s.onclick = () => {
      const a = s.dataset.a;
      if (!a) return;
      if (a.startsWith("fw")) {
        DJ.sfx.err();
        s.innerHTML = `${icFw}仅自己可见，转发给谁呢`;
        s.style.color = "#b8b8b8";
      } else if (a.startsWith("lk")) {
        DJ.sfx.click();
        const on = s.classList.toggle("on");
        $("lkn" + a.slice(2)).textContent = on ? "1" : "0";
      } else if (a.startsWith("cm")) {
        DJ.sfx.click();
        $("cm" + a.slice(2)).classList.toggle("show");
      }
    };
  });

  /* 评论 */
  document.querySelectorAll(".wcinput button").forEach(b => {
    b.onclick = () => {
      const i = b.dataset.s;
      const t = $("ci" + i).value.trim();
      if (!t) return;
      $("ci" + i).value = "";
      $("cn" + i).textContent = "已发送。等它显示出来吧。";
    };
  });
  document.querySelectorAll(".wcinput input").forEach(inp => {
    inp.addEventListener("keydown", e => { if (e.key === "Enter") inp.nextElementSibling.click(); });
  });

  /* 发帖框：写了也没人看 */
  $("cinput").onclick = () => { $("cinput").contentEditable = true; $("cinput").focus(); };
  $("composeBtn").onclick = () => {
    DJ.sfx.click();
    $("cinput").textContent = "既然没人看，就随便说说……";
    $("cinput").contentEditable = false;
    $("composeNote").textContent = "已发布。0 人可见。";
  };

  /* 深链 */
  document.querySelectorAll(".wtext").forEach(el => {
    for (const d of DEEP) {
      if (ch >= d.c && el.innerHTML.indexOf(d.w) !== -1) {
        el.innerHTML = el.innerHTML.replace(d.w, `<span class="deep" data-go="${d.go}">${d.w}</span>`);
      }
    }
  });
  document.querySelectorAll(".wtext .deep").forEach(s => {
    s.onclick = () => { DJ.sfx.click(); location.href = s.dataset.go; };
  });

  /* yunti.cloud 链接活了 */
  if (ch >= 8) {
    document.querySelectorAll(".wtext .code").forEach(c => {
      if (c.textContent.indexOf("yunti.cloud") !== -1) {
        c.classList.add("go");
        c.onclick = () => { DJ.sfx.click(); location.href = "cloud.html"; };
      }
    });
  }

  $("visit").textContent = "9";

  $("avatar").onclick = () => { DJ.sfx.click(); $("lbximg").src = "assets/media/butterfly.png"; $("lbx").classList.add("show"); };
  document.querySelectorAll("[data-lb]").forEach(el => {
    el.onclick = () => { DJ.sfx.click(); $("lbximg").src = "assets/media/butterfly.png"; $("lbx").classList.add("show"); };
  });
  $("lbx").onclick = () => $("lbx").classList.remove("show");
}
</script>
</body>
</html>
