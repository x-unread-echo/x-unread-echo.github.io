<style>
  body{background:#f2f2f5;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:#333;min-height:100vh}
  .moon{display:none !important}
  #envhint{display:none !important}
  svg.ic{width:1.1em;height:1.1em;vertical-align:-0.15em;fill:currentColor}

  /* ---------- 顶栏 ---------- */
  .topbar{background:#fff;border-bottom:1px solid #e8e8e8;position:sticky;top:0;z-index:50}
  .topbar .in{max-width:1080px;margin:0 auto;display:flex;align-items:center;gap:20px;padding:0 16px;height:50px}
  .logo{display:flex;align-items:center;gap:8px;cursor:pointer;flex-shrink:0;user-select:none}
  .logo b{font-size:21px;color:#ff8200;font-weight:800}
  .tsearch{flex:1;max-width:280px;background:#f2f2f5;border:1px solid #ededed;border-radius:16px;

  .tnav span{cursor:pointer;display:flex;align-items:center;gap:5px}
  .tnav span:hover{color:#ff8200}
  .tnav .me{width:30px;height:30px;border-radius:50%;overflow:hidden;border:1px solid #e3e3e3;cursor:pointer;padding:0;background:#fff}
  .tnav .me img{width:100%;height:100%;object-fit:cover}

  .cols{max-width:1080px;margin:14px auto 0;display:flex;gap:14px;padding:0 16px 70px;align-items:flex-start}
  @media (max-width:920px){ .sideR{display:none} }
  @media (max-width:760px){ .cols{flex-direction:column} .sideL{width:100% !important} }
  .sideL{width:245px;flex-shrink:0;display:flex;flex-direction:column;gap:12px}
  .main{flex:1;min-width:0}
  .sideR{width:245px;flex-shrink:0}

  .card{background:#fff;border:1px solid #e8e8e8;border-radius:3px;box-shadow:0 1px 3px rgba(0,0,0,.03)}

  .card .ch small{font-size:11px;color:#b0b0b0;font-weight:400}

  /* ---------- 个人主页卡 ---------- */
  .pcov{height:96px;background:linear-gradient(120deg,#3c4a58,#6a7d8e);position:relative;overflow:hidden}
  .pcov svg{position:absolute;right:18px;top:16px;width:60px;opacity:.18}
  .pava{width:76px;height:76px;border-radius:8px;border:3px solid #fff;margin:-44px 0 0 16px;

  .pava img{width:100%;height:100%;object-fit:cover;display:block}
  .pbody{padding:8px 16px 14px}
  .pname{font-size:18px;font-weight:700;display:flex;align-items:center;gap:6px}
  .pname .lv{font-size:10px;color:#f5a623;border:1px solid #f5a623;border-radius:8px;padding:0 5px;letter-spacing:1px}
  .pstats{display:flex;gap:28px;margin:12px 0 10px}
  .pstats b{display:block;font-size:16px;color:#333}
  .pstats span{font-size:12px;color:#808080}
  .pdesc{font-size:13px;color:#808080;line-height:2}
  .pdesc b{color:#333;font-weight:400}
  .pvisit{margin-top:10px;padding-top:10px;border-top:1px solid #f2f2f2;font-size:12px;color:#808080}
  .pvisit i{font-style:normal;color:#333}

  /* ---------- 他的关注 ---------- */
  .fu{display:flex;gap:10px;align-items:center;padding:9px 14px;border-bottom:1px solid #f5f5f5;cursor:pointer}
  .fu:last-child{border-bottom:none}
  .fu:hover{background:#fafafa}
  .fu .fa{width:38px;height:38px;border-radius:4px;flex-shrink:0;display:flex;align-items:center;justify-content:center;
    color:#fff;font-size:15px;font-weight:700}
  .fu .fn{font-size:13.5px;color:#333;font-weight:600}
  .fu:hover .fn{color:#ff8200}
  .fu .fd{font-size:11.5px;color:#999;margin-top:2px}
  .fuempty{padding:14px;font-size:12.5px;color:#999;line-height:1.9}

  /* ---------- 他分享的音乐 ---------- */
  .mus{display:flex;gap:10px;align-items:center;padding:10px 14px;border-bottom:1px solid #f5f5f5}
  .mus:last-child{border-bottom:none}
  .mus .mi{width:36px;height:36px;border-radius:4px;background:linear-gradient(135deg,#ff9d3c,#ff8200);
    display:flex;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer}
  .mus .mi svg{width:16px;height:16px;fill:#fff}
  .mus .mt{font-size:13.5px;color:#333;font-weight:600}
  .mus:hover .mt{color:#ff8200;cursor:pointer}
  .mus .md{font-size:11.5px;color:#999;margin-top:2px}

  /* ---------- 信息流 ---------- */
  .wb{display:flex;gap:12px;padding:16px 20px 4px;border-bottom:1px solid #f0f0f0}
  .wb:last-child{border-bottom:none}
  .wb .wa{width:46px;height:46px;border-radius:50%;overflow:hidden;flex-shrink:0;border:1px solid #ececec;cursor:zoom-in;background:#fff}
  .wb .wa img{width:100%;height:100%;object-fit:cover}
  .wbody{flex:1;min-width:0;padding-bottom:10px}
  .wname{font-size:14px;font-weight:700;color:#eb735;cursor:pointer}
  .wname:hover{text-decoration:underline}
  .wtime{font-size:12px;color:#808080;margin-top:2px}
  .wtime .src{color:#9a9a9a}
  .wlock{float:right;font-size:11px;color:#b8b8b8;border:1px solid #e3e3e3;border-radius:2px;padding:0 5px;background:#fafafa}
  .wtext{font-size:14px;line-height:1.9;margin-top:6px;color:#333;white-space:pre-line;word-break:break-all}
  .wtext .deep{color:#eb735;cursor:pointer}
  .wtext .deep:hover{text-decoration:underline}
  .wtext .code{color:#eb735}
  .wtext .code.go{cursor:pointer;border-bottom:1px dashed #eb735}
  .wfold{max-height:122px;overflow:hidden;position:relative}
  .wfold::after{content:"";position:absolute;left:0;right:0;bottom:0;height:56px;background:linear-gradient(180deg,rgba(255,255,255,0),#fff)}
  .wmore{color:#eb735;font-size:13px;cursor:pointer;display:inline-block;margin-top:2px}
  .wmore:hover{text-decoration:underline}

  /* 分享的音乐卡 */
  .wmusic{margin-top:8px;border:1px solid #f0e2d0;background:#fffcf8;border-radius:4px;padding:10px 14px;
    display:flex;gap:12px;align-items:center;cursor:pointer}
  .wmusic:hover{background:#fff6ea}
  .wmusic .mc{width:42px;height:42px;border-radius:4px;background:linear-gradient(135deg,#ff9d3c,#ff8200);
    display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .wmusic .mc svg{width:18px;height:18px;fill:#fff}
  .wmusic .mt{font-size:13.5px;color:#333;font-weight:600}
  .wmusic .md{font-size:12px;color:#999;margin-top:3px}
  .wmusic .mp{margin-left:auto}
  .wmusic .mp svg{width:20px;height:20px;fill:#ff8200}

  /* 操作栏 */
  .wacts{display:flex;margin-top:10px;border-top:1px solid #f5f5f5}
  .wacts span{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:9px 0;
    font-size:13px;color:#808080;cursor:pointer}
  .wacts span:hover{color:#ff8200}
  .wacts span.on{color:#ff8200}
  .wacts svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}

  /* 评论区 */
  .wcmts{background:#fafafa;border-radius:3px;margin-top:8px;padding:10px 12px;display:none}
  .wcmts.show{display:block}
  .wcmt{display:flex;gap:8px;padding:7px 0;border-bottom:1px dashed #eee;font-size:13px;line-height:1.8}
  .wcmt:last-of-type{border-bottom:none}
  .wcmt .ca{width:26px;height:26px;border-radius:50%;overflow:hidden;flex-shrink:0;border:1px solid #eee}
  .wcmt .ca img{width:100%;height:100%;object-fit:cover}
  .wcmt b{color:#eb735;font-weight:600}
  .wcmt.none{color:#999;font-size:12.5px;border:none;padding:4px 0}
  .wcinput{display:flex;gap:6px;margin-top:8px}
  .wcinput input{flex:1;border:1px solid #ddd;border-radius:3px;padding:6px 10px;font-size:12.5px;outline:none;font-family:inherit;color:#333}
  .wcinput input:focus{border-color:#ff8200}
  .wcinput button{border:1px solid #ff8200;background:#ff8200;color:#fff;border-radius:3px;padding:0 14px;font-size:12.5px;cursor:pointer}
  .wcinput button:hover{background:#f07600}
  .wcnote{font-size:11.5px;color:#999;margin-top:6px;min-height:1.6em}

  /* 右栏：搜搜热搜 */
  .hot{padding:4px 0}
  .hot .hi{display:flex;gap:8px;align-items:center;padding:7px 14px;font-size:13px;color:#333;cursor:pointer}
  .hot .hi:hover{background:#fafafa;color:#ff8200}
  .hot .hi b{color:#e35c5c;font-size:11px;font-style:normal;flex-shrink:0}
  .hot .hi small{margin-left:auto;color:#bbb;font-size:11px}

  .foot{text-align:center;font-size:12px;color:#9a9a9a;padding:18px 0 6px;line-height:2}
  .foot a{color:#507daf;text-decoration:none;margin:0 6px;cursor:pointer}

  .lbx{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;z-index:99;cursor:zoom-out}
  .lbx img{max-width:80vw;max-height:80vh;border-radius:8px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
  .lbx.show{display:flex}
</style>

<script>
if (DJ.gate(1)) main();
function main(){
  const $ = id => document.getElementById(id);
  const ch = DJ.state.chapter;

  /* ---------- 搜搜热搜：跟故事有关的那条混在里面 ---------- */
  const HOT = [
    ["接电话之前先深呼吸", "2.1亿"],
    ["年度关键词是“等”", "1.4亿"],
    ["谁把声控灯修好了", "8763万"],
    ["搬去朝北的房子的人", "5102万"],
    ["凌晨三点你会打给谁", "4988万"]
  ];
  $("hot").innerHTML = HOT.map((h,i) =>
    `<div class="hi"><b>${i===0?"热":"新"}</b>${h[0]}<small>${h[1]}</small></div>`
  ).join("");

  /* ---------- 嘀咕内容：2022-2026，全部仅自己可见 ---------- */
  const POSTS = [
    { d:"今天 03:17", long:true, t:`凌晨三点十七分醒的。没有闹钟，是自己醒的。

躺了一会儿，习惯性拿起手机看后台。这个号我四年没告诉过任何人，访问量一直是 8——我自己登一次算一次。

今天显示 9。

我把手机扣在床头，坐了很久。窗外一辆车都没有，安静得能听见冰箱的声音。可能是系统坏了。系统经常坏。

又拿起来看了一遍。还是 9。

我把灯关了，假装不在。` },
    { d:"08-08", long:true, t:`一年了。

备忘录里那条"明天回电"还挂着，我一直没删，也不敢点开。点开它就会问我：现在回吗？

有时候我想，如果那天我赢的是另一场，是不是电话就会响。后来不这么想了。赢不赢，电话都不会响的。电话响的时候，你永远不会想到是这一天。

今天楼道的声控灯坏了一盏，我上去的时候在黑里站了几秒。也没觉得害怕。黑的地方我熟。`,
      cmt:"补：声控灯今天修好了。踩上去「啪」一声，我居然吓了一跳。呵。" },
    { d:"05-20", long:true, t:`今天满世界都是 520。

我的手机安安静静。挺好。省得我练接电话。

说到这个，我这半年有个进步：手机铃声响起来的时候，手已经不那么抖了。先看是谁，再决定接不接——你看，排序了。排序就是进步。

备注是"家"的那个，还是不接。不是不想。是怕一接，就得说话；一说话，就得解释；一解释，就得承认这八年。

算了。明天再说。明天的我一向比我勇敢。` },
    { d:"03-02", long:true, t:`楼下有只卷毛的猫，蹲在门口，像没睡醒。

我隔着玻璃看了它十分钟，没敢开窗。

我怕开了窗，它就要进来了。它进来了，家里就有第二个心跳了。有第二个心跳，夜晚就会短一点。夜晚短一点，人就软一点。

我还是没开窗。明天再看看它在不在。`,
      cmt:"补：在。还带了只蝴蝶，逗着玩。猫都比我过得好。" },
    { d:"2025-08-07 23:58", long:true, t:`把这八年的东西都整理好了，放在 <span class="code">yunti.cloud</span>，提取码 <span class="code">0808</span>。

有些是截屏，有些是录音，有些是我半夜写的没人会看的东西。放在一起比我想象中重。

要是哪天我不在了，看到的人替我删掉。`,
      cmt:"补：别删。留着。总有一天用得上。另外提取码改了——改成那四个字了。你们懂。" },
    { d:"2025-12-24", long:true, t:`平安夜。楼下的餐厅在放歌，隔着墙都听得见热闹。

我戴上耳机，听一个很冷门的电台。亥时开播，一晚上就一句话。播完就没了，像烧完的火柴。

别人跨年倒数，我跨年等一句话。一句话等了一年，明年还等。

你问我图什么。图它准时。八年了，它比我认识的所有人都准时。` },
    { d:"2025-07-19", long:true, t:`年度报告出来了，说我今年的关键词是"等"。

等一个电话，等一句夸，等一个结果。报告还会看下一个年度的关键词是什么。我很想提前剧透给它：不会变的。

好几年了，关键词没换过。换人可以，换关键词不行。` },
    { d:"2025-04-05", long:true, t:`清明回去了一趟。

老房子的纱窗破了个洞，一只白蝶从那儿进来的，停在窗台上，停了很久。我没赶它。

小时候外婆说，蝶是引路的，别跟着走丢。她说话的时候手里总在剥豆子，豆子落进盆里，一颗一声。

我坐到天黑才走。走之前把纱窗的洞按了按，没补。万一她还要来呢。` },
    { d:"2025-04-01", long:true, t:`今天是愚人节，最适合说真话。

我想说我其实输不起。表面上说"重在参与"，回房间能把那一局复盘到凌晨四点。

今天也有一只白蝶，停在纱窗外面。不知道是不是上次那只。我没跟。我就在原地。` },
    { d:"2024-11-08", long:true, t:`又赢了一次。

他们说我这届最稳，问我有什么诀窍。我说睡得好。

其实我每天晚上都在重算。把输的那些局一遍一遍重新打，打到赢为止，手机烫得像块烙铁。

赛后有人问，站上去什么感觉。说实话，也就一般吧。没有想象中那个劲儿，就是松了一口气，像还了一笔债。

第二天接着欠。` },
    { d:"2024-08-08", long:true, t:`今天是我的生日。也是这个号的生日。我故意选的，省得记两个日子。

给自己买了个小蛋糕，吃到一半觉得没意思，剩下的放冰箱了。

关冰箱门的时候听见它"嗡"了一声。行吧，至少它回应我。` },
    { d:"2024-06-18", long:true, t:`把"输"改了个名字，叫"先攒着"。

攒着攒着，攒了 108 次。这个数字我记在本子上，本子放在枕头底下。

小时候家里人说，攒着攒着就没了。说得对，说得都对，每一句我都记得。就是没人问过我记不记得。` },
    { d:"2024-01-01", long:true, t:`新年愿望：接电话的手不要抖。

去年就许的这个。前年也是。

许愿这个东西吧，许一次没实现，许两次没实现，第三次你就会换个愿望。我不换。我固执起来连自己都怕。` },
    { d:"2023-10-31", long:true, t:`画了一个面具。本来只想画一层，回过神来已经画了七层。

第八层没画完，笔没水了。

也许是天意。也许第八层下面什么都没有，就像那家茶室的深夜场——你排到了，才发现接待的只有你自己。`,
      cmt:"补：后来找到笔了。还是没画第八层。有些层留着，万一以后用得上。" },
    { d:"2023-08-08", long:true, t:`生日。自我注册这个号起，今天是两岁。

给自己定的规矩：这一天不打排位，不复盘，不重算。就坐着。

坐到晚上十一点，没忍住，开了两把。都赢了。

赢了也没开心。你看，规矩就是用来输给自己的。` },
    { d:"2023-06-14", long:true, t:`通讯录里 412 个人。

今天闲着，从头翻到尾，试着找出五个"凌晨三点能打"的。挑来挑去挑出两个，再挑就挑不下去了。

"家"那个备注，去年改成了一串数字。这样它看起来就跟别的未接来电一样，不会特别疼。` },
    { d:"2023-05-01", long:true, t:`搬了家。朝北，晒不到太阳，房租便宜两百。

楼道的声控灯特别灵，跺一下脚就亮。我上楼从来不跺脚，就站在黑里等它自己亮。

它一般不亮。我一般就摸黑上去。

住我楼下的大爷说：小伙子，灯是给人照的，你捂着干嘛。我说习惯了。` },
    { d:"2023-02-14", long:true, t:`今天全世界都在过节。

我在排队，赢了八把。第八把赢完，我看着战报想，这话说给谁听呢。

后来发在了只有我一个人看的群里。系统提示：发送成功。

你看，至少系统是站在我这边的。` },
    { d:"2022-12-31", long:true, t:`今年打了 1,208 场，胜率 81%。

唯一输的那场，我到现在还记得对方的 ID。不是记仇。是我总在想，那天要是我再多睡一个小时，是不是就赢了。

睡得多，输得少。这是这几年学会的唯一一件事。` },
    { d:"2022-09-15", long:true, t:`买了个新本子，横线的，深红色皮。

本来想记点正经事，写了三行，全是别人听不懂的。字倒是写得比以前认真。

这个本子现在放在枕头底下。枕头底下放本子，是从外婆那儿学的——她说重要的事要压在头底下睡，睡着睡着就长进脑子里了。

这个号也一样。写在这儿，睡着睡着，就长进这儿了。` },
    { d:"2022-08-08", long:true, t:`注册了这个号。

大的那个号太多人看了，说什么都要想三遍，说到一半像在工作。这里说点真的。

……想了半天，也没什么真的可说。

就这样。晚安。`,
      cmt:"补：改主意了，不删。有的话写给谁不重要，写下来才重要。" }
  ];
  $("postnum").innerHTML = `<b>${POSTS.length}</b><span>嘀咕</span>`;

  /* ---------- 他分享的音乐 ---------- */
  const SONGS = [
    { t:"八点零八", cap:"这个时间打来的电话，我从来不敢不接。" },
    { t:"白蝶",    cap:"蝶是引路的。别跟着走丢。" },
    { t:"亥时",    cap:"亥时以后，夜场只接待一个人。" },
    { t:"朝北",    cap:"晒不到太阳，正好。反正我也怕被看清楚。" },
    { t:"先攒着",  cap:"攒了 108 次了。本子在枕头底下。" },
    { t:"声控灯",  cap:"站在黑里等它自己亮。它一般不亮。" }
  ];
  const playSvg = `<svg viewBox="0 0 24 24"><path d="M7 4.5v15l13-7.5-13-7.5z"/></svg>`;
  $("songs").innerHTML = SONGS.map(s =>
    `<div class="mus"><div class="mi">${playSvg}</div><div><div class="mt">${s.t}</div><div class="md">${s.cap}</div></div></div>`
  ).join("") + (ch >= 9 ? `<div class="mus" id="radioLink" style="cursor:pointer"><div class="mi">${playSvg}</div><div><div class="mt">深夜电台 FM 08.8</div><div class="md">八年只播一句话</div></div></div>` : "");
  if (ch >= 9) $("radioLink").onclick = () => { DJ.sfx.click(); location.href = "radio.html"; };

  /* ---------- 他的关注：走过才有 ---------- */
  const FU = [
    { t:"搜搜",     d:"什么都搜不到的搜索引擎", go:"search.html",   c:3,  col:"#7aa7d9", i:"搜" },
    { t:"空耳FM",   d:"听见没人在听的声音",     go:"music.html",    c:3,  col:"#ff8200", i:"♪" },
    { t:"倒影小组", d:"审了三年还没审完",       go:"forum.html",    c:5,  col:"#6bbd8f", i:"倒" },
    { t:"云屉网盘", d:"八年的东西都在里面",     go:"cloud.html",    c:8,  col:"#8d8dd9", i:"云" },
    { t:"深夜电台", d:"每天亥时开播",           go:"radio.html",    c:9,  col:"#4a4a4a", i:"波" },
    { t:"网上医院", d:"夜间门诊八点零八分开放", go:"hospital.html", c:10, col:"#e08888", i:"医" },
    { t:"一面墙",   d:"写满了别人的心事",       go:"board.html",    c:10, col:"#b0a58a", i:"墙" }
  ];
  $("follows").innerHTML = FU.filter(f => ch >= f.c).map(f =>
    `<div class="fu" data-go="${f.go}"><div class="fa" style="background:${f.col}">${f.i}</div><div><div class="fn">${f.t}</div><div class="fd">${f.d}</div></div></div>`
  ).join("") || `<div class="fuempty">他只关注了 3 个官方账号。<br>一个人住，关注列表也这么安静。</div>`;
  document.querySelectorAll("#follows .fu").forEach(el => {
    el.onclick = () => { DJ.sfx.click(); location.href = el.dataset.go; };
  });

  /* ---------- 渲染嘀咕流 ---------- */
  const DEEP = [
    { w:"未接来电",     go:"dial.html",   c:1 },
    { w:"茶室的深夜场", go:"oracle.html", c:4 },
    { w:"卷毛的猫",     go:"adopt.html",  c:7 },
    { w:"画了一个面具", go:"mask.html",   c:9 },
    { w:"亥时开播",     go:"radio.html",  c:9 }
  ];
  $("feed").innerHTML = POSTS.map((p, idx) => {
    const comments = p.cmt
      ? `<div class="wcmt"><div class="ca"><img src="assets/media/butterfly.png" alt=""></div><div><b>北屋</b>：${p.cmt}</div></div>`
      : `<div class="wcmt none">还没有评论。</div>`;
    return `<div class="wb">
      <div class="wa" data-lb="${idx}"><img src="assets/media/butterfly.png" alt=""></div>
      <div class="wbody">
        <span class="wlock">仅自己可见</span>
        <div class="wname">北屋</div>
        <div class="wtime">${p.d}<span class="src"> · 来自北屋的旧手机</span></div>
        <div class="wtext ${p.long ? "wfold" : ""}" id="wt${idx}">${p.t}</div>
        ${p.long ? `<span class="wmore" data-t="${idx}">全文</span>` : ""}
        <div class="wacts">
          <span data-a="fw${idx}"><svg viewBox="0 0 24 24"><path d="M14 5l7 7-7 7v-4C8 15 5 17 3 20c0-6 3-10 11-11V5z"/></svg>转发</span>
          <span data-a="cm${idx}"><svg viewBox="0 0 24 24"><path d="M4 4h16v12H8l-4 4V4z"/></svg>评论 ${p.cmt ? 1 : 0}</span>
          <span data-a="lk${idx}" id="lk${idx}"><svg viewBox="0 0 24 24"><path d="M7 11v9H4a1 1 0 0 1-1-1v-7a1 1 0 0 1 1-1h3zm2 9V10.5L13 3c1.3.2 2 1.1 2 2.5V9h5a2 2 0 0 1 2 2l-1.6 7a2 2 0 0 1-2 1.5H9z"/></svg>赞 <em id="lkn${idx}" style="font-style:normal">0</em></span>
        </div>
        <div class="wcmts" id="cm${idx}">${comments}
          <div class="wcinput"><input id="ci${idx}" maxlength="60" placeholder="说点什么……"><button data-s="${idx}">评论</button></div>
          <div class="wcnote" id="cn${idx}"></div>
        </div>
      </div>
    </div>`;
  }).join("");

  /* 全文折叠 */
  document.querySelectorAll(".wmore").forEach(m => {
    m.onclick = () => {
      DJ.sfx.click();
      const t = $("wt" + m.dataset.t);
      const folded = t.classList.toggle("wfold");
      m.textContent = folded ? "全文" : "收起";
    };
  });

  /* 转发 / 赞 */
  document.querySelectorAll(".wacts span").forEach(s => {
    s.onclick = () => {
      const a = s.dataset.a;
      if (!a) return;
      if (a.startsWith("fw")) {
        DJ.sfx.err();
        s.style.color = "#999";
        s.innerHTML = `<svg class="ic" viewBox="0 0 24 24"><path d="M14 5l7 7-7 7v-4C8 15 5 17 3 20c0-6 3-10 11-11V5z"/></svg>仅自己可见，转发给谁呢`;
      } else if (a.startsWith("lk")) {
        DJ.sfx.click();
        const on = s.classList.toggle("on");
        $("lkn" + a.slice(2)).textContent = on ? "1" : "0";
      } else if (a.startsWith("cm")) {
        DJ.sfx.click();
        $("cm" + a.slice(2)).classList.toggle("show");
      }
    };
  });

  /* 评论 */
  document.querySelectorAll(".wcinput button").forEach(b => {
    b.onclick = () => {
      const i = b.dataset.s;
      const t = $("ci" + i).value.trim();
      if (!t) return;
      $("ci" + i).value = "";
      $("cn" + i).textContent = "已发送。等它显示出来吧。";
    };
  });
  document.querySelectorAll(".wcinput input").forEach(inp => {
    inp.addEventListener("keydown", e => { if (e.key === "Enter") inp.nextElementSibling.click(); });
  });

  /* 深链 */
  document.querySelectorAll(".wtext").forEach(el => {
    for (const d of DEEP) {
      if (ch >= d.c && el.innerHTML.indexOf(d.w) !== -1) {
        el.innerHTML = el.innerHTML.replace(d.w, `<span class="deep" data-go="${d.go}">${d.w}</span>`);
      }
    }
  });
  document.querySelectorAll(".wtext .deep").forEach(s => {
    s.onclick = () => { DJ.sfx.click(); location.href = s.dataset.go; };
  });

  /* yunti.cloud 链接活了 */
  if (ch >= 8) {
    document.querySelectorAll(".wtext .code").forEach(c => {
      if (c.textContent.indexOf("yunti.cloud") !== -1) {
        c.classList.add("go");
        c.onclick = () => { DJ.sfx.click(); location.href = "cloud.html"; };
      }
    });
  }

  $("visit").textContent = "9";

  $("avatar").onclick = () => { DJ.sfx.click(); $("lbximg").src = "assets/media/butterfly.png"; $("lbx").classList.add("show"); };
  document.querySelectorAll("[data-lb]").forEach(el => {
    el.onclick = () => { DJ.sfx.click(); $("lbximg").src = "assets/media/butterfly.png"; $("lbx").classList.add("show"); };
  });
  $("lbx").onclick = () => $("lbx").classList.remove("show");
}
</script>
</body>
</html>
