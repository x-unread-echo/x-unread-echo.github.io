<style>

  /* 年份分隔：不是标签，就是日记本里的分页纸 */

  .post{background:#fffdf7;border:1px solid #ecd9b0;border-radius:10px;

  /* 留言板：能写，但…… */
  .gbinput{display:flex;gap:6px;margin-top:6px}
  .gbinput input{flex:1;border:1.5px solid #d9b98a;border-radius:6px;background:#fffdf7;

  .gbinput input:focus{border-color:#8fa3b8}
  .gbinput button{border:1.5px solid #41566b;background:linear-gradient(180deg,#52687f,#41566b);
    color:#fdf2e0;border-radius:6px;padding:4px 12px;font-size:11.5px;letter-spacing:2px;cursor:pointer;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.25)}
  .gbinput button:hover{filter:brightness(1.08)}
  .gbnote{font-size:11px;color:#b8845c;letter-spacing:1px;margin-top:6px;line-height:1.8;min-height:1.8em}

  /* 友情链接：他常去的地方 */
  .flink{padding:4px 2px;border-bottom:1px dotted #e8cba0;font-size:12.5px;letter-spacing:1px}
  .flink:last-child{border-bottom:none}
  .flink a{color:#7a4a30;cursor:pointer;text-decoration:none}
  .flink a:hover{color:#41566b;text-decoration:underline}
  .flink .fd{display:block;font-size:10.5px;color:#c9ad8c;letter-spacing:1px;margin-top:1px}

  /* 碎碎念里提到的地方：走到过的才点得动 */
  .deep{color:#41566b;border-bottom:1px dashed #41566b;cursor:pointer}
  .deep:hover{background:#eef2f6}

  /* 帖子页脚：真博客都有的那行小字 */
  .pmeta{margin-top:9px;font-size:10.5px;color:#c9ad8c;font-family:var(--mono);letter-spacing:1px;

  .foot{margin-top:18px;text-align:center;font-size:11px;color:#b8845c;letter-spacing:2px;line-height:2}
  .foot b{color:#41566b}
  .counter{margin-top:6px;font-family:var(--mono);font-size:10.5px;color:#c9ad8c;letter-spacing:3px}
  .counter i{display:inline-block;background:#5a3a28;color:#fdf2e0;border-radius:2px;
    padding:1px 4px;margin:0 1px;font-style:normal}
</style>

<script>
if (DJ.gate(1)) main();
function main(){
  const $ = id => document.getElementById(id);
  const ch = DJ.state.chapter;

  /* ---------- 碎碎念：超长、仅自己可见、2022-2026 ---------- */
  const YEARS = [
    { y:"2026", tag:"还在更新", posts:[
      { d:"09-26", mood:"心情：醒着", paw:"🐾", lock:true, t:`凌晨三点十七分醒的。没有闹钟，是自己醒的。

躺了一会儿，习惯性拿起手机看后台。这个号我四年没告诉过任何人，访问量一直是 8——我自己登一次算一次。

今天显示 9。

我把手机扣在床头，坐了很久。窗外一辆车都没有，安静得能听见冰箱的声音。可能是系统坏了。系统经常坏。

又拿起来看了一遍。还是 9。

我把灯关了，假装不在。` },
      { d:"08-08", mood:"心情：照旧", paw:"🐾", lock:true, t:`一年了。

备忘录里那条"明天回电"还挂着，我一直没删，也不敢点开。点开它就会问我：现在回吗？

有时候我想，如果那天我赢的是另一场，是不是电话就会响。后来不这么想了。赢不赢，电话都不会响的。电话响的时候，你永远不会想到是这一天。

今天楼道的声控灯坏了一盏，我上去的时候在黑里站了几秒。也没觉得害怕。黑的地方我熟。`,
        self:{ w:"北屋", m:"补：声控灯今天修好了。踩上去「啪」一声，我居然吓了一跳。呵。" } },
      { d:"05-20", mood:"心情：没劲", lock:true, t:`今天满世界都是 520。

我的手机安安静静。挺好。省得我练接电话。

说到这个，我这半年有个进步：手机铃声响起来的时候，手已经不那么抖了。先看是谁，再决定接不接——你看，排序了。排序就是进步。

备注是"家"的那个，还是不接。不是不想。是怕一接，就得说话；一说话，就得解释；一解释，就得承认这八年。

算了。明天再说。明天的我一向比我勇敢。` },
      { d:"03-02", mood:"心情：软的", paw:"🐾", lock:true, t:`楼下有只卷毛的猫，蹲在门口，像没睡醒。

我隔着玻璃看了它十分钟，没敢开窗。

我怕开了窗，它就要进来了。它进来了，家里就有第二个心跳了。有第二个心跳，夜晚就会短一点。夜晚短一点，人就软一点。

我还是没开窗。明天再看看它在不在。`,
        self:{ w:"北屋", m:"补：在。还带了只蝴蝶，逗着玩。猫都比我过得好。" } }
    ]},
    { y:"2025", tag:"", posts:[
      { d:"08-07 · 23:58", mood:"心情：收尾", lock:true, t:`把这八年的东西都整理好了，放在 <span class="code">yunti.cloud</span>，提取码 <span class="code">0808</span>。

有些是截屏，有些是录音，有些是我半夜写的没人会看的东西。放在一起比我想象中重。

要是哪天我不在了，看到的人替我删掉。`, self:{ w:"北屋", m:"补：别删。留着。总有一天用得上。另外提取码改了——改成那四个字了。你们懂。" } },
      { d:"12-24", mood:"心情：静", lock:true, t:`平安夜。楼下的餐厅在放歌，隔着墙都听得见热闹。

我戴上耳机，听一个很冷门的电台。亥时开播，一晚上就一句话。播完就没了，像烧完的火柴。

别人跨年倒数，我跨年等一句话。一句话等了一年，明年还等。

你问我图什么。图它准时。八年了，它比我认识的所有人都准时。` },
      { d:"07-19", mood:"心情：等", lock:true, t:`年度报告出来了，说我今年的关键词是"等"。

等一个电话，等一句夸，等一个结果。报告还会看下一个年度的关键词是什么。我很想提前剧透给它：不会变的。

好几年了，关键词没换过。换人可以，换关键词不行。` },
      { d:"04-05", mood:"心情：回家的那种", paw:"🐾", lock:true, t:`清明回去了一趟。

老房子的纱窗破了个洞，一只白蝶从那儿进来的，停在窗台上，停了很久。我没赶它。

小时候外婆说，蝶是引路的，别跟着走丢。她说话的时候手里总在剥豆子，豆子落进盆里，一颗一声。

我坐到天黑才走。走之前把纱窗的洞按了按，没补。万一她还要来呢。` },
      { d:"04-01", mood:"心情：真话日", lock:true, t:`今天是愚人节，最适合说真话。

我想说我其实输不起。表面上说"重在参与"，回房间能把那一局复盘到凌晨四点。

今天也有一只白蝶，停在纱窗外面。不知道是不是上次那只。我没跟。我就在原地。` }
    ]},
    { y:"2024", tag:"", posts:[
      { d:"11-08", mood:"心情：松了一口气", lock:true, t:`又赢了一次。

他们说我这届最稳，问我有什么诀窍。我说睡得好。

其实我每天晚上都在重算。把输的那些局一遍一遍重新打，打到赢为止，手机烫得像块烙铁。

赛后有人问，站上去什么感觉。说实话，也就一般吧。没有想象中那个劲儿，就是松了一口气，像还了一笔债。

第二天接着欠。` },
      { d:"08-08", mood:"心情：不吃蛋糕", lock:true, t:`今天是我的生日。也是这个号的生日。我故意选的，省得记两个日子。

给自己买了个小蛋糕，吃到一半觉得没意思，剩下的放冰箱了。

关冰箱门的时候听见它"嗡"了一声。行吧，至少它回应我。` },
      { d:"06-18", mood:"心情：记账中", lock:true, t:`把"输"改了个名字，叫"先攒着"。

攒着攒着，攒了 108 次。这个数字我记在本子上，本子放在枕头底下。

小时候家里人说，攒着攒着就没了。说得对，说得都对，每一句我都记得。就是没人问过我记不记得。` },
      { d:"01-01", mood:"心情：老愿望", lock:true, t:`新年愿望：接电话的手不要抖。

去年就许的这个。前年也是。

许愿这个东西吧，许一次没实现，许两次没实现，第三次你就会换个愿望。我不换。我固执起来连自己都怕。` }
    ]},
    { y:"2023", tag:"", posts:[
      { d:"10-31", mood:"心情：第七层", lock:true, t:`画了一个面具。本来只想画一层，回过神来已经画了七层。

第八层没画完，笔没水了。

也许是天意。也许第八层下面什么都没有，就像那家茶室的深夜场——你排到了，才发现接待的只有你自己。`,
        self:{ w:"北屋", m:"补：后来找到笔了。还是没画第八层。有些层留着，万一以后用得上。" } },
      { d:"08-08", mood:"心情：一个人过", lock:true, t:`生日。自我注册这个号起，今天是两岁。

给自己定的规矩：这一天不打排位，不复盘，不重算。就坐着。

坐到晚上十一点，没忍住，开了两把。都赢了。

赢了也没开心。你看，规矩就是用来输给自己的。` },
      { d:"06-14", mood:"心情：412 分之一", lock:true, t:`通讯录里 412 个人。

今天闲着，从头翻到尾，试着找出五个"凌晨三点能打"的。挑来挑去挑出两个，再挑就挑不下去了。

"家"那个备注，去年改成了一串数字。这样它看起来就跟别的未接来电一样，不会特别疼。` },
      { d:"05-01", mood:"心情：啪", lock:true, t:`搬了家。朝北，晒不到太阳，房租便宜两百。

楼道的声控灯特别灵，跺一下脚就亮。我上楼从来不跺脚，就站在黑里等它自己亮。

它一般不亮。我一般就摸黑上去。

住我楼下的大爷说：小伙子，灯是给人照的，你捂着干嘛。我说习惯了。` },
      { d:"02-14", mood:"心情：第八把", lock:true, t:`今天全世界都在过节。

我在排队，赢了八把。第八把赢完，我看着战报想，这话说给谁听呢。

后来发在了只有我一个人看的群里。系统提示：发送成功。

你看，至少系统是站在我这边的。` }
    ]},
    { y:"2022", tag:"这个号的开始", posts:[
      { d:"12-31", mood:"心情：盘点", lock:true, t:`今年打了 1,208 场，胜率 81%。

唯一输的那场，我到现在还记得对方的 ID。不是记仇。是我总在想，那天要是我再多睡一个小时，是不是就赢了。

睡得多，输得少。这是这几年学会的唯一一件事。` },
      { d:"09-15", mood:"心情：新本子", lock:true, t:`买了个新本子，横线的，深红色皮。

本来想记点正经事，写了三行，全是别人听不懂的。字倒是写得比以前认真。

这个本子现在放在枕头底下。枕头底下放本子，是从外婆那儿学的——她说重要的事要压在头底下睡，睡着睡着就长进脑子里了。

这个号也一样。写在这儿，睡着睡着，就长进这儿了。` },
      { d:"08-08", mood:"心情：新号", lock:true, t:`注册了这个号。

大的那个号太多人看了，说什么都要想三遍，说到一半像在工作。这里说点真的。

……想了半天，也没什么真的可说。

就这样。晚安。`,
        self:{ w:"北屋", m:"补：改主意了，不删。有的话写给谁不重要，写下来才重要。" } }
    ]}
  ];

  /* ---------- 他的歌单：歌是编的，心事是真的 ---------- */
  const SONGS = [
    { t:"八点零八", hot:"这个时间打来的电话，我从来不敢不接。" },
    { t:"白蝶",    hot:"蝶是引路的。别跟着走丢。" },
    { t:"亥时",    hot:"亥时以后，夜场只接待一个人。" },
    { t:"朝北",    hot:"晒不到太阳，正好。反正我也怕被看清楚。" },
    { t:"先攒着",  hot:"攒了 108 次了。本子在枕头底下。" },
    { t:"声控灯",  hot:"站在黑里等它自己亮。它一般不亮。" }
  ];
  $("songs").innerHTML = SONGS.map((s,i) =>
    `<div class="song"><span class="no">0${i+1}</span><div><div class="st">${s.t}</div><div class="hot">— ${s.hot}</div></div></div>`
  ).join("") + (ch >= 9 ? `<div class="song" style="margin-top:8px"><span class="no">📻</span><div><div class="st" style="color:#41566b;cursor:pointer" id="radioLink">深夜电台 FM 08.8</div><div class="hot">—— 八年只播一句话</div></div></div>` : "");

  if (ch >= 9) $("radioLink").onclick = () => { DJ.sfx.click(); location.href = "radio.html"; };

  /* ---------- 归档：真博客都有的那列年份，点哪年翻哪年 ---------- */
  const renderFeed = (year) => {
    $("feed").innerHTML = YEARS.filter(Y => !year || Y.y === year).map(Y =>
      `<div class="yhead"><b>${Y.y}</b><i></i><small>${Y.tag || ""}</small></div>` +
      Y.posts.map(p =>
        `<div class="post"><div class="pdate"><span>${Y.y}-${p.d}</span><span class="mood">${p.mood || ""}</span><span class="lock">仅自己可见</span></div>` +
        `<div class="ptext">${p.t}</div>` +
        (p.self ? `<div class="pself"><b>${p.self.w}：</b>${p.self.m}</div>`
                : `<div class="pself"><span class="none">— 暂无补充。他还没想好要说给谁听。</span></div>`) +
        (p.paw ? `<span class="paw">${p.paw}</span>` : "") +
        `<div class="pmeta"><span>阅读 8</span><span>评论 0</span></div></div>`
      ).join("")
    ).join("");
    /* 碎碎念里提到的地方：走到过的，字就活了，能点进去 */
    const DEEP = [
      { w:"未接来电", go:"dial.html", c:1 },
      { w:"茶室的深夜场", go:"oracle.html", c:4 },
      { w:"卷毛的猫", go:"adopt.html", c:7 },
      { w:"画了一个面具", go:"mask.html", c:9 },
      { w:"亥时开播", go:"radio.html", c:9 }
    ];
    document.querySelectorAll("#feed .ptext").forEach(el => {
      for (const d of DEEP) {
        if (ch >= d.c && el.textContent.indexOf(d.w) !== -1) {
          el.innerHTML = el.innerHTML.replace(d.w, `<span class="deep" data-go="${d.go}">${d.w}</span>`);
        }
      }
    });
    document.querySelectorAll("#feed .deep").forEach(s => {
      s.onclick = () => { DJ.sfx.click(); location.href = s.dataset.go; };
    });
    /* yunti.cloud：走到云屉那章后，碎碎念里的链接就能点进去了 */
    if (ch >= 8) {
      document.querySelectorAll("#feed .code").forEach(c => {
        if (c.textContent.indexOf("yunti.cloud") !== -1) {
          c.style.cursor = "pointer";
          c.style.borderBottom = "1px dashed #41566b";
          c.onclick = () => { DJ.sfx.click(); location.href = "cloud.html"; };
        }
      });
    }
  };
  const renderArch = (active) => {
    $("arch").innerHTML = YEARS.map(Y =>
      `<div class="arch ${active === Y.y ? "on" : ""}" data-y="${Y.y}"><span class="ay">${Y.y} 年</span><span class="ac">${Y.posts.length} 篇</span></div>`
    ).join("") +
    (active ? `<div class="arch" data-y=""><span class="ay" style="color:#a8886a">← 全部年份</span><span class="ac">回</span></div>` : "");
    document.querySelectorAll("#arch .arch").forEach(el => {
      el.onclick = () => {
        DJ.sfx.click();
        renderFeed(el.dataset.y || null);
        renderArch(el.dataset.y || null);
        $("feedPanel").scrollIntoView({ behavior: "smooth" });
      };
    });
  };
  renderArch(null);
  renderFeed(null);

  /* ---------- 友情链接：他常去的地方。走进过的站，列表里才有它 ---------- */
  const FR = [
    { t:"搜搜", d:"什么都搜不到的搜索引擎", go:"search.html", c:3 },
    { t:"倒影小组", d:"审了三年还没审完", go:"forum.html", c:5 },
    { t:"云屉网盘", d:"八年的东西都在里面", go:"cloud.html", c:8 },
    { t:"空耳FM", d:"听见没人在听的声音", go:"music.html", c:3 },
    { t:"深夜电台 FM 08.8", d:"每天亥时开播", go:"radio.html", c:9 },
    { t:"网上医院 · 夜间门诊", d:"八点零八分开放", go:"hospital.html", c:10 },
    { t:"备忘 · 一面墙", d:"写满了别人的心事", go:"board.html", c:10 }
  ];
  $("friends").innerHTML = FR.filter(f => ch >= f.c).map(f =>
    `<div class="flink"><a data-go="${f.go}">☆ ${f.t}</a><span class="fd">${f.d}</span></div>`
  ).join("") || `<div class="flink" style="color:#c9ad8c;font-size:11.5px">（还没有可以交换的链接。）</div>`;
  document.querySelectorAll("#friends a").forEach(a => {
    a.onclick = () => { DJ.sfx.click(); location.href = a.dataset.go; };
  });

  /* ---------- 顶部导航：锚点滚动 ---------- */
  document.querySelectorAll(".bnav a").forEach(a => {
    a.onclick = () => { DJ.sfx.click(); $(a.dataset.to).scrollIntoView({ behavior: "smooth" }); };
  });

  /* ---------- 留言板：能写。写完就等吧 ---------- */
  $("gbGo").onclick = () => {
    const t = $("gbText").value.trim();
    if (!t) return;
    $("gbText").value = "";
    $("gbNote").textContent = "已提交。等它显示出来吧。";
  };
  $("gbText").addEventListener("keydown", e => { if (e.key === "Enter") $("gbGo").onclick(); });

  $("avatar").onclick = () => { DJ.sfx.click(); $("lbximg").src = "assets/media/butterfly.png"; $("lbx").classList.add("show"); };
  $("lbx").onclick = () => $("lbx").classList.remove("show");
}
</script>
</body>
</html>
