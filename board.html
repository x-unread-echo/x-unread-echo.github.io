<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>一面墙</title>
<link rel="stylesheet" href="assets/style.css?v=52">
<style>
  body{background:#080b12;overflow-x:hidden}
  .wrap{max-width:820px;margin:0 auto;padding:34px 16px 120px}
  .head{text-align:center;margin-bottom:8px}
  .head h1{color:#dfe5ee;font-weight:300;font-size:26px;letter-spacing:12px}
  .head p{color:#42536f;font-size:12px;letter-spacing:3px;margin-top:8px}
  .board{position:relative;margin:30px auto 0;max-width:760px;height:520px;
    background:linear-gradient(160deg,#101827 0%,#0b101c 100%);
    border:1px solid #1c2c4a;border-radius:12px;
    box-shadow:0 24px 80px rgba(0,0,0,.6), inset 0 1px 0 rgba(174,191,216,.05);overflow:hidden}
  .board::before{content:"";position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(ellipse at 50% 40%,transparent 40%,rgba(0,0,0,.45) 100%)}
  svg.strings{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:2}
  svg.strings line{stroke:#9e3f39;stroke-width:1.6;stroke-opacity:.75;
    stroke-dasharray:200;stroke-dashoffset:200;transition:stroke-dashoffset 1.1s ease}
  svg.strings line.on{stroke-dashoffset:0}
  .chip{position:absolute;width:132px;padding:11px 12px;cursor:pointer;z-index:3;
    background:#0e1626;border:1px solid #2c3a52;border-radius:6px;
    box-shadow:0 8px 24px rgba(0,0,0,.45);transition:transform .5s,border-color .5s,opacity .5s;
    transform:rotate(var(--rot))}
  .chip:hover{border-color:#4a7dd6;transform:rotate(var(--rot)) translateY(-3px)}
  .chip .lab{color:#8b9ab5;font-size:11px;letter-spacing:2px;line-height:1.6}
  .chip .num{color:#dfe5ee;font-family:var(--mono);font-size:17px;letter-spacing:2px;margin-top:6px;
    opacity:0;transition:opacity .8s .3s}
  .chip.done{cursor:default;border-color:#9e3f39;transform:rotate(0deg)}
  .chip.done .num{opacity:1}
  .chip.done .lab{color:#5a6a84}
  .pin{position:absolute;top:-7px;left:50%;margin-left:-5px;width:10px;height:10px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%,#c0564f,#5e1f1c);box-shadow:0 2px 6px rgba(0,0,0,.6)}
  .core{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);z-index:1;
    width:150px;height:150px;border-radius:50%;border:1px dashed #2c3a52;
    display:flex;align-items:center;justify-content:center;transition:all 1.4s}
  .core .z{color:#2c3a52;font-size:13px;letter-spacing:4px;transition:color 1.4s}
  .core.lit{border-color:#c0564f;box-shadow:0 0 60px rgba(158,63,57,.35), inset 0 0 40px rgba(158,63,57,.15)}
  .core.lit .z{color:#e8b5b0;font-family:var(--mono);font-size:30px;letter-spacing:8px;
    animation:corepulse 2.4s ease infinite}
  @keyframes corepulse{0%,100%{opacity:.75}50%{opacity:1}}
  .verdict{max-width:640px;margin:44px auto 0;display:none}
  .verdict.show{display:block}
  .vline{color:#c9d6ea;font-size:16.5px;line-height:2.4;letter-spacing:2px;opacity:0;
    transform:translateY(10px);transition:all 1.2s ease;text-align:center}
  .vline.on{opacity:1;transform:none}
  .vline.red{color:#e8b5b0}
  .backhub{display:block;margin:48px auto 0;background:none;border:1px solid #2c3a52;color:#aebfd8;
    padding:12px 34px;border-radius:3px;cursor:pointer;letter-spacing:4px;font-size:14px;
    opacity:0;transition:opacity 1.4s,border-color .3s}
  .backhub.show{opacity:1}
  .backhub:hover{border-color:#4a7dd6}
  @media (max-width:640px){
    .board{height:640px}
    .chip{width:112px;padding:9px 10px}
    .chip .num{font-size:14px}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <h1>一 面 墙</h1>
    <p>你在每一个抽屉里都捡到过一块碎片。现在，把它们钉上去。</p>
  </div>

  <div class="board" id="board">
    <div class="core" id="core"><span class="z">？</span></div>
    <svg class="strings" id="strings" viewBox="0 0 100 100" preserveAspectRatio="none"></svg>
    <!-- 8 张碎片由 JS 钉上 -->
  </div>

  <div class="verdict" id="verdict">
    <div class="vline">每一个抽屉里，都躺着同一个数字。</div>
    <div class="vline">不是巧合。他把能上锁的地方，全部锁在了同一天。</div>
    <div class="vline red">2025 年 8 月 8 日。</div>
    <div class="vline">不是因为他忘不了那天。</div>
    <div class="vline red">是他怕——哪天连这一天，自己也忘了。</div>
  </div>
  <button class="backhub" id="backhub">把 这 面 墙 带 走 →</button>
</div>

<script>
if (DJ.gate(10)) main();
function main(){
  DJ.revisit("board");
  const $ = id => document.getElementById(id);
  const board = $("board"), svg = $("strings");

  /* 8 块碎片：全部真实的、你查到过的数字 */
  const chips = [
    {x:6,  y:6,  rot:-4, lab:"挂号系统 · 病历号",   num:"08-0808"},
    {x:74, y:4,  rot:5,  lab:"复诊提醒 · 时间",     num:"08:08"},
    {x:40, y:2,  rot:-2, lab:"流水账 · 总数",       num:"80808"},
    {x:4,  y:66, rot:3,  lab:"镜中人 · 锁",         num:"0808"},
    {x:78, y:68, rot:-5, lab:"面具 · 层数",         num:"8"},
    {x:12, y:36, rot:-3, lab:"青云观 · 第八支签",   num:"八"},
    {x:70, y:35, rot:4,  lab:"倒影小组 · 页码",     num:"第 8 页"},
    {x:42, y:76, rot:-2, lab:"那一天",              num:"2025-08-08"}
  ];
  let done = 0, busy = false;

  chips.forEach((c, i) => {
    const el = document.createElement("div");
    el.className = "chip";
    el.style.left = c.x + "%"; el.style.top = c.y + "%";
    el.style.setProperty("--rot", c.rot + "deg");
    el.innerHTML = `<div class="pin"></div><div class="lab">${c.lab}</div><div class="num">${c.num}</div>`;
    el.onclick = () => {
      if (el.classList.contains("done") || busy) return;
      busy = true;
      el.classList.add("done");
      DJ.sfx.click();
      /* 红线：碎片中心 → 墙中心（viewBox 坐标） */
      const ln = document.createElementNS("http://www.w3.org/2000/svg", "line");
      const cx = c.x + 8, cy = c.y + 5;
      ln.setAttribute("x1", Math.min(96, Math.max(4, cx)));
      ln.setAttribute("y1", Math.min(94, Math.max(4, cy)));
      ln.setAttribute("x2", 50); ln.setAttribute("y2", 46);
      svg.appendChild(ln);
      requestAnimationFrame(() => requestAnimationFrame(() => ln.classList.add("on")));
      done++;
      if (done === 8) setTimeout(reveal, 1500);
      setTimeout(() => busy = false, 700);
    };
    board.appendChild(el);
  });

  function reveal(){
    $("core").classList.add("lit");
    $("core").querySelector(".z").textContent = "0808";
    DJ.sfx.ok();
    /* 越过屏幕的一瞬：连标题都被它改了 */
    const t = document.title;
    document.title = "已 读";
    setTimeout(() => document.title = t, 2600);
    const vs = document.querySelectorAll(".vline");
    document.getElementById("verdict").classList.add("show");
    vs.forEach((v, i) => setTimeout(() => {
      v.classList.add("on");
      if (i === vs.length - 1) DJ.sfx.read(); else DJ.sfx.type();
    }, 900 + i * 1900));
    setTimeout(() => $("backhub").classList.add("show"), 900 + vs.length * 1900 + 900);
  }

  $("backhub").onclick = () => {
    DJ.flag("board_done"); DJ.addIncense(2);
    DJ.sfx.ok();
    document.body.classList.add("flash");
    setTimeout(() => location.href = "hub.html", 420);
  };

  /* 断点续玩：钉过的墙直接亮 */
  if (DJ.has("board_done")){
    document.querySelectorAll(".chip").forEach(el => el.classList.add("done"));
    $("core").classList.add("lit");
    $("core").querySelector(".z").textContent = "0808";
    $("verdict").classList.add("show");
    document.querySelectorAll(".vline").forEach(v => v.classList.add("on"));
    $("backhub").classList.add("show");
  }

  DJ.envHint("这面墙你其实早就拼完了。只是一直没人替你把它们排在一起。", "bd1", 120);
}
</script>
</body>
</html>
