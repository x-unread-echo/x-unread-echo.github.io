<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>桌面</title>
<link rel="stylesheet" href="assets/style.css?v=56">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:-apple-system,"PingFang SC",sans-serif;overflow:hidden;
    background:#0a1018;color:#c9d6ea;user-select:none}
  /* 壁纸：深夜蓝，中央一个极淡的水印 */
  .wall{position:fixed;inset:0;
    background:
      radial-gradient(ellipse at 30% 20%, #14202f 0%, transparent 55%),
      radial-gradient(ellipse at 75% 80%, #101a26 0%, transparent 50%),
      linear-gradient(160deg,#0b1220 0%,#080d16 60%,#0a1119 100%)}
  .wall::after{content:"X";position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);
    font-size:120px;font-weight:200;letter-spacing:30px;color:rgba(174,191,216,.045)}
  /* 桌面图标网格 */
  .dicons{position:fixed;inset:14px 10px 58px;display:flex;flex-wrap:wrap;
    align-content:flex-start;gap:6px 2px;overflow-y:auto}
  .dicon{position:relative;width:86px;padding:10px 4px 8px;border-radius:8px;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;gap:7px;text-align:center;
    transition:background .15s}
  .dicon:hover{background:rgba(174,191,216,.08)}
  .dicon:active{background:rgba(174,191,216,.14)}
  .dtile{width:52px;height:52px;border-radius:12px;display:flex;align-items:center;justify-content:center;
    font-size:20px;font-weight:600;letter-spacing:2px;
    box-shadow:0 6px 16px rgba(0,0,0,.4), inset 0 1px 0 rgba(174,191,216,.12);
    border:1px solid rgba(255,255,255,.08)}
  .dtile.dim{filter:grayscale(.9) brightness(.55)}
  .dicon .dl{font-size:11.5px;color:#c9d6ea;letter-spacing:1px;line-height:1.4;
    text-shadow:0 1px 3px rgba(0,0,0,.8)}
  .dicon.dim .dl{color:#4a5870}
  .dicon.cur .dl{color:#fff}
  .dicon.cur .dtile{box-shadow:0 0 18px rgba(120,160,220,.35)}
  /* 窗口 */
  #winwrap{position:fixed;inset:0;z-index:40;display:none;align-items:center;justify-content:center;
    background:rgba(4,7,13,.45);backdrop-filter:blur(2px)}
  #winwrap.show{display:flex}
  .win{width:min(360px,88vw);background:#0e1524;border:1px solid #22304a;border-radius:12px;
    box-shadow:0 30px 80px rgba(0,0,0,.7);overflow:hidden;
    animation:winpop .18s ease}
  @keyframes winpop{from{transform:scale(.92);opacity:0}to{transform:none;opacity:1}}
  .wtitle{display:flex;align-items:center;justify-content:space-between;
    background:#111a2c;border-bottom:1px solid #1c2c4a;padding:9px 12px}
  .wtitle span{font-size:12.5px;color:#8fa0bd;letter-spacing:2px}
  .wtitle b{color:#3a4a68;font-weight:400;letter-spacing:3px;cursor:pointer;padding:0 4px}
  .wbody{padding:18px 18px 20px;text-align:center}
  .wicon{width:58px;height:58px;border-radius:14px;margin:0 auto 12px;display:flex;
    align-items:center;justify-content:center;font-size:22px;font-weight:600}
  .wdesc{font-size:13px;color:#8b9ab5;line-height:2;letter-spacing:1px;min-height:52px}
  .wmeta{font-size:11px;color:#42536f;margin-top:8px;letter-spacing:1px;font-family:var(--mono)}
  .wopen{margin-top:16px;background:#16233c;border:1px solid #2c3a52;color:#aebfd8;
    padding:9px 34px;border-radius:6px;cursor:pointer;font-size:13px;letter-spacing:4px}
  .wopen:hover{border-color:#4a7dd6;color:#fff}
  /* 任务栏 */
  .taskbar{position:fixed;left:0;right:0;bottom:0;height:46px;z-index:50;
    background:rgba(10,16,26,.92);border-top:1px solid #1c2c4a;backdrop-filter:blur(14px);
    display:flex;align-items:center;gap:10px;padding:0 10px}
  .startb{background:#16233c;border:1px solid #2c3a52;color:#aebfd8;border-radius:7px;
    padding:6px 14px;font-size:12px;letter-spacing:2px;cursor:pointer}
  .startb:hover{border-color:#4a7dd6;color:#fff}
  .ttask{font-size:11px;color:#6d80a0;letter-spacing:1px;background:#0e1626;
    border:1px solid #16233c;border-radius:6px;padding:4px 10px;max-width:150px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tspace{flex:1}
  .tclock{font-family:var(--mono);font-size:11.5px;color:#6d80a0;letter-spacing:1px}
  /* 开始菜单 */
  #startmenu{position:fixed;left:10px;bottom:52px;z-index:60;width:210px;
    background:#0e1524;border:1px solid #22304a;border-radius:10px;
    box-shadow:0 20px 50px rgba(0,0,0,.6);overflow:hidden;display:none}
  #startmenu.show{display:block;animation:winpop .16s ease}
  .smi{padding:11px 16px;font-size:12.5px;color:#9fb0ca;letter-spacing:2px;cursor:pointer;
    border-bottom:1px solid #131c2e}
  .smi:hover{background:#111a2c;color:#dfe5ee}
  .smi small{display:block;color:#42536f;font-size:10.5px;margin-top:2px;letter-spacing:1px}
  /* 气泡通知 */
  .balloon{position:fixed;right:12px;bottom:56px;z-index:55;max-width:260px;
    background:#111a2c;border:1px solid #22304a;border-radius:10px;padding:12px 14px;
    font-size:12px;color:#9fb0ca;line-height:1.9;letter-spacing:1px;
    box-shadow:0 16px 40px rgba(0,0,0,.55);opacity:0;transform:translateY(8px);
    transition:all .5s}
  .balloon.show{opacity:1;transform:none}
  .balloon b{color:#dfe5ee;display:block;margin-bottom:4px;font-weight:500}
  /* 关机覆盖层 */
  #shut{position:fixed;inset:0;z-index:80;background:#000;display:none;
    align-items:center;justify-content:center;flex-direction:column;gap:14px}
  #shut.show{display:flex}
  #shut .s1{color:#33415e;font-size:14px;letter-spacing:6px}
  #shut .s2{color:#5a6a84;font-size:12px;letter-spacing:3px;opacity:0;transition:opacity 2s}
</style>
</head>
<body>
<div class="wall"></div>
<div class="dicons" id="dicons"></div>

<div id="winwrap">
  <div class="win">
    <div class="wtitle"><span id="wname">窗口</span><b id="wclose">✕</b></div>
    <div class="wbody">
      <div class="wicon" id="wicon"></div>
      <div class="wdesc" id="wdesc"></div>
      <div class="wmeta" id="wmeta"></div>
      <button class="wopen" id="wopen">打 开</button>
    </div>
  </div>
</div>

<div id="startmenu">
  <div class="smi" id="smSearch">搜 索<small>全站检索 · 有时能搜出不该搜到的</small></div>
  <div class="smi" id="smHome">起 始 页<small>这故事开始的地方</small></div>
  <div class="smi" id="smShut">关 机<small>你确定要现在关掉它吗</small></div>
</div>

<div class="balloon" id="balloon"></div>

<div class="taskbar">
  <button class="startb" id="startb">◈ 开始</button>
  <div class="ttask" id="task1" style="display:none"></div>
  <div class="tspace"></div>
  <div class="tclock" id="tclock"></div>
</div>

<div id="shut"><div class="s1">正在关机…</div><div class="s2" id="shut2">它没有关。</div></div>

<div id="envhint"></div>
<script src="assets/game.js?v=56"></script>
<script>
if (DJ.gate(1)) main();
function main(){
  const $ = id => document.getElementById(id);
  const ch = DJ.state.chapter;
  const name = DJ.state.name || "";

  /* 时钟 */
  const tick = () => $("tclock").textContent = new Date().toLocaleTimeString("zh-CN",{hour12:false});
  tick(); setInterval(tick, 1000);

  /* 桌面文件：全部章节入口 */
  const ICONS = [
    {c:1,  l:"电", k:"c1", t:"通话记录",   d:"未接来电 8 次。那个号码没有署名。",       h:"dial.html",   m:"最近：8 天前"},
    {c:2,  l:"信", k:"c2", t:"短 信",      d:"未读（38）。从来只有你这边在说。",        h:"chat.html",   m:"最近：8 天前"},
    {c:3,  l:"观", k:"c3", t:"青云观",     d:"线上问己。香火还剩 " + DJ.state.incense + " 支。", h:"guanyun.html", m:"收藏夹"},
    {c:4,  l:"茶", k:"c4", t:"第八茶室",   d:"深夜场。营业时间：亥时。",                h:"oracle.html", m:"收藏夹"},
    {c:5,  l:"影", k:"c5", t:"倒影小组",   d:"Reflexion BBS。当前在线 1 人。",          h:"forum.html",  m:"浏览器历史"},
    {c:6,  l:"账", k:"c6", t:"流水账",     d:"记事本。共 8 笔。有一笔被更正过。",       h:"ledger.html", m:"文档"},
    {c:7,  l:"猫", k:"c7", t:"领养页",     d:"猫屋 · 同城分类信息。已举报。",           h:"adopt.html",  m:"浏览器历史"},
    {c:8,  l:"云", k:"c8", t:"云屉网盘",   d:"剩余空间 8 GB。有些文件夹是空的。",       h:"cloud.html",  m:"已挂载"},
    {c:9,  l:"面", k:"c9", t:"面具.jpg",   d:"本机文件。别数错层数。",                  h:"mask.html",   m:"图片"},
    {c:10, l:"档", k:"c10",t:"档案室",     d:"内网。需要工牌。",                        h:"archive.html",m:"内网"},
    {c:11, l:"镜", k:"c11",t:"E C H O",    d:"对话框。对面显示在线。",                  h:"echo8.html",  m:"置顶"},
    {c:12, l:"终", k:"c12",t:"顺其自然",   d:"没有标题的文件。",                        h:"final.html",  m:"???"},
    {c:90, l:"台", k:"c8", t:"深夜电台",   d:"FM 08.8。八年只播一句话。",               h:"radio.html",  m:"每天", min:9},
    {c:91, l:"相", k:"c7", t:"他的一晚",   d:"相册。8 张照片，和一句没发出去的话。",    h:"photos.html", m:"图片", min:10},
    {c:92, l:"医", k:"c1", t:"第八医院",   d:"网上服务平台。心理睡眠中心 · 夜间门诊。", h:"hospital.html", m:"内网", min:10},
    {c:93, l:"墙", k:"c6", t:"一面墙",     d:"备忘。你在每一个抽屉里都捡到过一块碎片。",h:"board.html",  m:"待拼", min:10}
  ];

  const COLORS = {c1:"#241520",c2:"#16233c",c3:"#132722",c4:"#1d2412",c5:"#231a30",
                  c6:"#2a2113",c7:"#251a14",c8:"#122330",c9:"#1c1526",c10:"#1a2130",
                  c11:"#10262e",c12:"#26201a"};
  const TINT = {c1:"#d09088",c2:"#7fa3d8",c3:"#7fbfa8",c4:"#b8bf7a",c5:"#ab8fd0",
                c6:"#d0b478",c7:"#cf9d72",c8:"#7fb8cf",c9:"#b39ad8",c10:"#93a5c4",
                c11:"#8ec7d4",c12:"#d8cbb2"};

  let curWin = null;
  const box = $("dicons");

  function addIcon(e){
    const locked = e.min ? ch < e.min : ch < e.c;
    const isCur = !e.min && e.c === ch;
    const el = document.createElement("div");
    el.className = "dicon" + (locked ? " dim" : "") + (isCur ? " cur" : "");
    el.innerHTML = `<div class="dtile ${locked ? "dim" : e.k}"
        style="background:${COLORS[e.k]};color:${TINT[e.k]}">${locked ? "🔒" : e.l}</div>
      <div class="dl">${e.t}</div>`;
    el.onclick = () => {
      DJ.sfx.click();
      if (locked){ DJ.sfx.err(); DJ.envHintNow("打不开。还不是时候——有些文件，要先在别处留下痕迹。"); return; }
      openWin(e);
    };
    box.appendChild(el);
  }
  ICONS.forEach(addIcon);

  /* 假窗口 */
  function openWin(e){
    curWin = e;
    $("wname").textContent = e.t;
    $("wdesc").textContent = e.d;
    $("wmeta").textContent = e.m;
    const wi = $("wicon");
    wi.style.background = COLORS[e.k]; wi.style.color = TINT[e.k];
    wi.textContent = e.l;
    $("winwrap").classList.add("show");
    const t = $("task1");
    t.style.display = "block"; t.textContent = "▣ " + e.t;
  }
  function closeWin(){
    $("winwrap").classList.remove("show");
    $("task1").style.display = "none";
    curWin = null;
  }
  $("wclose").onclick = closeWin;
  $("winwrap").onclick = e => { if (e.target === $("winwrap")) closeWin(); };
  $("wopen").onclick = () => {
    if (!curWin) return;
    DJ.sfx.ok();
    document.body.classList.add("flash");
    setTimeout(() => location.href = curWin.h, 380);
  };

  /* 开始菜单 */
  $("startb").onclick = e => { e.stopPropagation(); DJ.sfx.click(); $("startmenu").classList.toggle("show"); };
  document.addEventListener("click", e => {
    if (!$("startmenu").contains(e.target) && e.target !== $("startb")) $("startmenu").classList.remove("show");
  });
  $("smSearch").onclick = () => { DJ.sfx.click(); location.href = "search.html"; };
  $("smHome").onclick   = () => { DJ.sfx.click(); location.href = "index.html"; };
  $("smShut").onclick   = () => {
    $("startmenu").classList.remove("show");
    $("shut").classList.add("show");
    setTimeout(() => $("shut2").style.opacity = 1, 1800);
    setTimeout(() => { $("shut").classList.remove("show"); $("shut2").style.opacity = 0;
      DJ.envHintNow("它没有关。这台设备记得一切。"); }, 5200);
  };

  /* 气泡：现实入侵 */
  if (DJ.rvOf("hub") >= 2 || DJ.revisit("hub") >= 2){
    setTimeout(() => {
      const b = $("balloon");
      b.innerHTML = "<b>系统通知</b>欢迎回来，" + (name || "没有留名字的人") + "。你是今天第 8 位访客。今天，一个访客都没有。";
      b.classList.add("show");
      DJ.sfx.type();
      setTimeout(() => b.classList.remove("show"), 7000);
    }, 1600);
  }

  DJ.envHint("点图标看文件。有些图标是灰的——还不是时候。", "dk1", 120);
  DJ.envHint("开始菜单里可以关机。但你试过就知道了。", "dk2", 260);
}
</script>
</body>
</html>
