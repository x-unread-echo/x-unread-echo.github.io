<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache">
<title>新标签页</title>
<link rel="stylesheet" href="assets/style.css?v=60">
<style>
  body{
    background:
      radial-gradient(1200px 500px at 50% -10%, rgba(64,86,140,.28), transparent 60%),
      radial-gradient(900px 400px at 85% 110%, rgba(48,110,104,.14), transparent 60%),
      #0b1018;
    font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:#c9d6ea;
    min-height:100vh;
  }
  /* 浏览器窗框 */
  .chrome{max-width:900px;margin:20px auto 90px;border:1px solid rgba(120,150,210,.16);border-radius:14px;
    overflow:hidden;box-shadow:0 24px 80px rgba(0,0,0,.55), 0 0 0 1px rgba(0,0,0,.4);
    background:linear-gradient(180deg,#101726 0%,#0d1320 100%)}
  .bar{background:linear-gradient(180deg,#141d30,#111927);border-bottom:1px solid rgba(120,150,210,.14);
    padding:10px 14px;display:flex;align-items:center;gap:12px}
  .dots{display:flex;gap:6px}
  .dots i{width:11px;height:11px;border-radius:50%;display:block;box-shadow:inset 0 -1px 2px rgba(0,0,0,.3)}
  .dots i:nth-child(1){background:#e0655e}.dots i:nth-child(2){background:#e0b25a}.dots i:nth-child(3){background:#5cbf85}
  .tab{background:#0d1420;border:1px solid rgba(120,150,210,.18);border-bottom:none;border-radius:8px 8px 0 0;
    font-size:12px;color:#9db1d4;padding:6px 18px;letter-spacing:1px;position:relative;top:1px}
  .addr{flex:1;display:flex;align-items:center;gap:8px;background:rgba(8,12,20,.8);border:1px solid rgba(120,150,210,.14);
    border-radius:99px;padding:7px 16px;font-size:12.5px;color:#5a6a84;letter-spacing:1px;font-family:var(--mono)}
  .addr .lock{color:#5cbf85;font-size:11px}
  .addr b{color:#9db1d4;font-weight:400}
  .page{padding:34px 40px 44px;min-height:480px}

  .hello{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px}
  .hello h1{font-size:22px;letter-spacing:3px;font-weight:600;color:#e8eefb}
  .hello h1 b{color:#7f93b8;font-weight:400}
  #clock{font-family:var(--mono);color:#4a5a78;font-size:12px;letter-spacing:2px}

  /* 中央搜索框：真浏览器新标签页的样子 */
  .searchwrap{max-width:560px;margin:34px auto 8px;position:relative}
  .sbox{display:flex;align-items:center;gap:12px;background:rgba(16,24,40,.9);
    border:1px solid rgba(120,150,210,.2);border-radius:99px;padding:14px 24px;
    box-shadow:0 8px 30px rgba(0,0,0,.35);transition:border-color .25s, box-shadow .25s}
  .sbox:focus-within{border-color:rgba(110,150,230,.55);box-shadow:0 8px 34px rgba(40,70,140,.35)}
  .sbox .ic{color:#5a6f95;font-size:15px}
  .sbox input{flex:1;background:none;border:none;outline:none;color:#dfe8f8;font-size:14.5px;letter-spacing:1px}
  .sbox input::placeholder{color:#3d4c6b}
  .searchhint{text-align:center;font-size:11px;color:#33415e;letter-spacing:2px;margin-top:10px}

  /* 快捷方式：固定网格，永远不变 */
  .sect{margin-top:34px}
  .sect h2{font-size:12px;color:#4a5a78;letter-spacing:4px;font-weight:400;margin-bottom:14px;
    display:flex;justify-content:space-between;align-items:baseline}
  .sect h2 span.r{color:#33415e;font-size:11px}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
  @media (max-width:640px){ .grid{grid-template-columns:repeat(2,1fr)} .page{padding:24px 18px 34px} }
  .tile{border:1px solid rgba(120,150,210,.13);background:linear-gradient(180deg,rgba(20,30,52,.5),rgba(14,20,34,.5));
    border-radius:12px;padding:14px 12px;display:flex;flex-direction:column;align-items:center;gap:8px;
    cursor:pointer;transition:transform .2s, border-color .2s, background .2s;text-align:center;position:relative}
  .tile:hover{transform:translateY(-3px);border-color:rgba(120,160,230,.4);
    background:linear-gradient(180deg,rgba(26,38,66,.65),rgba(16,24,42,.65))}
  .tile .fvc{width:40px;height:40px;border-radius:11px;display:flex;align-items:center;justify-content:center;
    font-size:16px;font-weight:600;border:1px solid rgba(255,255,255,.08);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.08), 0 4px 12px rgba(0,0,0,.4)}
  .tile .nm{font-size:12.5px;color:#c9d6ea;letter-spacing:1px;line-height:1.4}
  .tile .u{font-size:10px;color:#3d4c6b;font-family:var(--mono);letter-spacing:0}
  .tile:hover .nm{color:#fff}
  /* 已解锁图标的渐变色板 */
  .fvc.c1{background:linear-gradient(135deg,#3a1d2a,#59283a);color:#e69a90}
  .fvc.c2{background:linear-gradient(135deg,#16294c,#1f3a6e);color:#8db4f2}
  .fvc.c3{background:linear-gradient(135deg,#143026,#1d4a37);color:#7fd0ac}
  .fvc.c4{background:linear-gradient(135deg,#2c3312,#45501c);color:#cfd878}
  .fvc.c5{background:linear-gradient(135deg,#2b1d45,#3f2a63);color:#b99ae8}
  .fvc.c6{background:linear-gradient(135deg,#3d2e10,#5a4418);color:#eccb74}
  .fvc.c7{background:linear-gradient(135deg,#3a2415,#573620);color:#e8a876}
  .fvc.c8{background:linear-gradient(135deg,#122c3f,#1a4258);color:#7cc4e8}
  .fvc.c9{background:linear-gradient(135deg,#241536,#37204e);color:#c49af0}
  .fvc.c10{background:linear-gradient(135deg,#1a2438,#26334e);color:#a3b6d8}
  .fvc.c11{background:linear-gradient(135deg,#0e2c38,#164456);color:#86d2e4}
  .fvc.c12{background:linear-gradient(135deg,#33291c,#4a3c28);color:#e2d2b4}
  /* 未解锁：灰的，但它是真实存在的一个格子 */
  .tile.dim{cursor:not-allowed;opacity:.55}
  .tile.dim:hover{transform:none;border-color:rgba(120,150,210,.13);background:linear-gradient(180deg,rgba(20,30,52,.5),rgba(14,20,34,.5))}
  .tile.dim .fvc{background:rgba(20,28,46,.9);color:#3d4c6b;border-color:rgba(120,150,210,.1);box-shadow:none}
  .tile.dim .nm{color:#4a5a78}
  /* 下一站：它在呼吸 */
  .tile.breathe{border-color:rgba(120,150,210,.25)}
  .tile.breathe .fvc{animation:brt 2.8s ease-in-out infinite}
  @keyframes brt{0%,100%{opacity:.45}50%{opacity:1}}
  /* NEW 角标 */
  .newbadge{position:absolute;top:8px;right:8px;font-size:9px;letter-spacing:1px;color:#0b1018;
    background:#7fd0ac;border-radius:99px;padding:2px 7px;font-weight:700;animation:pop .5s ease both}
  @keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}

  /* 最近访问：永远只有一条 */
  .recent{border:1px solid rgba(120,150,210,.13);border-radius:12px;background:rgba(16,24,40,.55);
    padding:14px 18px;display:flex;align-items:center;gap:14px;cursor:pointer;transition:border-color .2s}
  .recent:hover{border-color:rgba(120,160,230,.4)}
  .recent .tt{flex:1;min-width:0}
  .recent .tt b{display:block;font-size:14px;color:#e8eefb;letter-spacing:1px}
  .recent .tt span{display:block;font-size:11px;color:#4a5a78;margin-top:3px;font-family:var(--mono)}
  .recent .when{font-size:11px;color:#4f8f8b;letter-spacing:1px;font-family:var(--mono);white-space:nowrap}

  /* 书签栏 */
  .bmarks{display:flex;gap:10px;flex-wrap:wrap}
  .bm{border:1px solid rgba(120,150,210,.16);background:rgba(16,24,40,.6);border-radius:99px;padding:9px 20px;
    font-size:13px;color:#9db1d4;cursor:pointer;letter-spacing:2px;transition:border-color .2s,color .2s}
  .bm:hover{border-color:#6f9de0;color:#e8eefb}

  .foot{margin-top:38px;padding-top:16px;border-top:1px dashed rgba(120,150,210,.12);font-size:11px;
    color:#33415e;letter-spacing:2px;line-height:2.2}
  .foot em{color:#4f8f8b;font-style:normal}
  #sync{color:#4f8f8b;opacity:0;transition:opacity 2s;letter-spacing:2px;font-size:11px}

  /* 浏览器通知弹窗（右下角） */
  .ntf{position:fixed;right:18px;bottom:18px;max-width:320px;background:#141d30;border:1px solid rgba(120,150,210,.3);
    border-radius:12px;padding:14px 16px;box-shadow:0 14px 40px rgba(0,0,0,.55);
    transform:translateY(20px);opacity:0;transition:all .5s ease;z-index:99;cursor:pointer}
  .ntf.on{transform:none;opacity:1}
  .ntf .h{font-size:11px;color:#5a6a84;letter-spacing:1px;margin-bottom:6px;display:flex;align-items:center;gap:6px}
  .ntf .b{font-size:13px;color:#dfe8f8;letter-spacing:1px;line-height:1.7}

  @media (max-width:600px){ .page{padding:22px 18px 30px} }
</style>
</head>
<body>
<div class="moon"></div>
<div class="chrome">
  <div class="bar">
    <div class="dots"><i></i><i></i><i></i></div>
    <div class="tab">新标签页</div>
    <div class="addr"><span class="lock">🔒</span><b>daji://</b>newtab</div>
  </div>
  <div class="page">
    <div class="hello">
      <h1 id="hello">晚上好。</h1>
      <div id="clock"></div>
    </div>

    <div class="searchwrap">
      <div class="sbox">
        <span class="ic">🔍</span>
        <input type="text" id="q" placeholder="搜搜，或输入一个网址…" autocomplete="off">
      </div>
      <div class="searchhint">有些网站，要自己搜得到网址才进得去</div>
    </div>

    <div class="sect">
      <h2>快捷方式 <span class="r" id="sync"></span></h2>
      <div class="grid" id="grid"></div>
    </div>

    <div class="sect">
      <h2>最近访问</h2>
      <div id="recent"></div>
    </div>

    <div class="sect">
      <h2>书签</h2>
      <div class="bmarks">
        <div class="bm" data-go="search.html">🔍 搜搜</div>
        <div class="bm" data-go="index.html">🏠 起始页</div>
      </div>
    </div>

    <div class="foot" id="foot"></div>
  </div>
</div>
<div class="ntf" id="ntf"></div>
<div id="envhint"></div>
<script src="assets/game.js?v=60"></script>
<script>
if (DJ.gate(1)) main();
function main(){
  const $ = id => document.getElementById(id);
  const ch = DJ.state.chapter;
  const name = DJ.state.name || "";

  /* 问候：跟着你的真实时间走 */
  const h = new Date().getHours();
  let greet = "晚上好";
  if (h < 5) greet = "这个点，还在线";
  else if (h < 11) greet = "早上好";
  else if (h < 14) greet = "中午好";
  else if (h < 18) greet = "下午好";
  $("hello").innerHTML = greet + (name ? "，" + name : "") + "。";
  const tick = () => $("clock").textContent = "本地时间 " + new Date().toLocaleTimeString("zh-CN", {hour12:false});
  tick(); setInterval(tick, 1000);

  /* 浏览器通知 */
  let ntfTimer = null;
  const notify = (head, body, ms) => {
    const n = $("ntf");
    n.innerHTML = `<div class="h">◉ ${head}</div><div class="b">${body}</div>`;
    requestAnimationFrame(() => n.classList.add("on"));
    clearTimeout(ntfTimer);
    ntfTimer = setTimeout(() => n.classList.remove("on"), ms || 7000);
  };

  /* 快捷方式：16 格固定网格，从第一秒起就长这样，永远不会多出一行 */
  const SITES = [
    {c:1,  l:"电", k:"c1",  t:"通话记录",        u:"daji://call/log",       h:"dial.html"},
    {c:2,  l:"未", k:"c2",  t:"短信",            u:"daji://im/inbox",       h:"chat.html"},
    {c:3,  l:"观", k:"c3",  t:"青云观",          u:"daji://temple",         h:"guanyun.html"},
    {c:4,  l:"茶", k:"c4",  t:"第八茶室",        u:"daji://tea/8th",        h:"oracle.html"},
    {c:5,  l:"影", k:"c5",  t:"倒影小组",        u:"daji://bbs",            h:"forum.html"},
    {c:6,  l:"账", k:"c6",  t:"流水账",          u:"daji://notes",          h:"ledger.html"},
    {c:7,  l:"猫", k:"c7",  t:"同城领养",        u:"daji://pets",           h:"adopt.html"},
    {c:8,  l:"云", k:"c8",  t:"云屉",            u:"daji://drive",          h:"cloud.html"},
    {c:9,  l:"面", k:"c9",  t:"面具.jpg",        u:"daji://files",          h:"mask.html"},
    {c:10, l:"档", k:"c10", t:"内网档案",        u:"daji://intranet",       h:"archive.html"},
    {c:11, l:"镜", k:"c11", t:"对话框",          u:"daji://im/echo",        h:"echo8.html"},
    {c:12, l:"终", k:"c12", t:"顺其自然",        u:"daji://final",          h:"final.html"},
    {c:9,  l:"台", k:"c8",  t:"深夜电台",        u:"daji://fm/08.8",        h:"radio.html",  atmo:1, err:"这个电台每天亥时开播。现在没有声音。"},
    {c:10, l:"相", k:"c7",  t:"相册",            u:"daji://album",          h:"photos.html", atmo:1, err:"相册还在同步。它已经同步了八年。"},
    {c:10, l:"医", k:"c1",  t:"网上医院",        u:"daji://hospital",       h:"hospital.html", atmo:1, err:"夜间门诊未开放。开放时间是八点零八分。"},
    {c:10, l:"墙", k:"c6",  t:"备忘 · 一面墙",   u:"daji://notes/wall",     h:"board.html",  atmo:1, err:"你还没有捡到第一块碎片。"}
  ];
  const ERRS = {
    1:"这串号码没有主人。你打不开别人的通话记录。",
    2:"你登不进去。这台设备只认一个账号。",
    3:"网页需要邀请码。你还没有。",
    4:"深夜场只在亥时营业。还没到。",
    5:"这个论坛需要注册。审核标准未知。",
    6:"记事本被另一个窗口占用了。",
    7:"该分类信息站对你所在地区不可见。",
    8:"网盘空间已满。你要先往里面放点东西。",
    9:"文件损坏。双击没有反应。",
    10:"内网地址。你需要一张工牌。",
    11:"对面没有在线。",
    12:"404。这个页面还不存在。"
  };
  const seen = parseInt(localStorage.getItem("daji_hub_seen_ch") || "0", 10);
  let newCount = 0;

  const grid = $("grid");
  SITES.forEach(s => {
    /* 章节站：解锁到 ch；氛围站（电台/相册等）到章即开 */
    const open = s.atmo ? (ch >= s.c) : (s.c <= ch);
    const isNext = !open && !s.atmo && (s.c === ch + 1);
    const tile = document.createElement("div");
    tile.className = "tile" + (open ? "" : " dim") + (isNext ? " breathe" : "");
    if (open && s.c > seen) {
      tile.insertAdjacentHTML("beforeend", `<div class="newbadge">NEW</div>`);
      newCount++;
    }
    tile.innerHTML = `<div class="fvc ${open ? s.k : ""}">${open ? s.l : "◌"}</div>
      <div class="nm">${open ? s.t : (isNext ? "……" : "&nbsp;")}</div>
      <div class="u">${open ? s.u : "&nbsp;"}</div>`;
    tile.onclick = open
      ? () => { DJ.sfx.click(); location.href = s.h; }
      : () => {
          DJ.sfx.err();
          DJ.envHintNow(s.err || (isNext
            ? "这个网站你知道它在那里。但你还不知道它的网址。"
            : ERRS[s.c] || "打不开。"));
        };
    grid.appendChild(tile);
  });

  /* 新解锁 → 浏览器通知自己冒出来 */
  if (newCount > 0) {
    setTimeout(() => {
      notify("浏览器",
        newCount === 1
          ? "发现一个新网站，已添加到你的快捷方式。"
          : "发现 " + newCount + " 个新网站，已添加到你的快捷方式。", 8000);
    }, 1200);
  }
  localStorage.setItem("daji_hub_seen_ch", String(Math.max(seen, ch)));

  /* 最近访问：永远只显示当前这一条 */
  const cur = SITES.find(s => s.c === ch && !s.err);
  if (cur){
    const r = document.createElement("div");
    r.className = "recent";
    r.innerHTML = `<div class="fvc ${cur.k}" style="width:34px;height:34px;border-radius:9px;display:flex;
      align-items:center;justify-content:center;font-size:14px;font-weight:600">${cur.l}</div>
      <div class="tt"><b>${cur.t}</b><span>${cur.u}</span></div>
      <div class="when">刚刚 · ${new Date().toLocaleTimeString("zh-CN",{hour:"2-digit",minute:"2-digit",hour12:false})}</div>`;
    r.onclick = () => { DJ.sfx.click(); location.href = cur.h; };
    $("recent").appendChild(r);
  }

  /* 现实入侵：它知道你回来过几次（用通知，不占版面） */
  const rv = DJ.rvOf("hub") || 0;
  if (DJ.revisit("hub") >= 2){
    setTimeout(() => {
      notify("访客统计",
        `欢迎回来。你是今天第 ${rv >= 4 ? "88" : "8"} 位访客。<br>——这句话的另一个意思是：今天，一个访客都没有。`, 9000);
    }, 3800);
  }

  /* 书签 */
  document.querySelectorAll(".bm").forEach(b => b.onclick = () => { DJ.sfx.click(); location.href = b.dataset.go; });

  /* 搜索框：回车去搜搜 */
  $("q").addEventListener("keydown", e => {
    if (e.key === "Enter"){ DJ.sfx.click(); location.href = "search.html"; }
  });

  /* 页脚：设备所有者 */
  $("foot").innerHTML =
    `这台设备的所有者：${name ? name : "（没有留名字的人）"} · 上次在线：刚刚<br>` +
    `同步状态：<em>历史记录在另一台设备上也会更新。你删不掉。</em>`;

  DJ.envHint("这台浏览器记得一切。后退是没用的。", "hb1", 120);
  DJ.envHint("有些网址，要你在别的地方留下痕迹之后，才会被你搜到。", "hb2", 260);
}
</script>
</body>
</html>
