<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的小窝</title>
<link rel="stylesheet" href="assets/style.css?v=59">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:repeating-linear-gradient(0deg,#fdf4f1 0 26px,#f9e7e2 26px 27px),
               repeating-linear-gradient(90deg,#fdf4f1 0 26px,#f9e7e2 26px 27px),#fdf4f1;
    font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:#5c4a4e;
    padding:22px 14px 60px;-webkit-user-select:none;user-select:none}
  .moon{display:none !important}

  /* 贴纸 */
  .stk{position:fixed;font-size:30px;opacity:.85;z-index:1;pointer-events:none;
    filter:drop-shadow(0 3px 6px rgba(180,120,130,.25))}
  .stk.small{font-size:20px}

  /* 论坛横幅 */
  .wrap{max-width:760px;margin:0 auto;position:relative;z-index:2}
  .banner{background:linear-gradient(135deg,#fbd9de 0%,#f7cdd6 55%,#f3c3cf 100%);
    border:2px solid #eba9b6;border-bottom:none;border-radius:16px 16px 0 0;
    padding:20px 24px 14px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;
    box-shadow:0 10px 30px rgba(217,122,138,.18)}
  .banner h1{font-family:"Yuanti SC","PingFang SC",sans-serif;font-size:24px;letter-spacing:4px;color:#b04a5e;font-weight:700}
  .banner h1 i{font-style:normal;font-size:14px;color:#d98a98;margin-left:10px;letter-spacing:2px;font-weight:400}
  #clock{font-size:11.5px;color:#c4798a;letter-spacing:1px;background:rgba(255,255,255,.55);
    padding:5px 12px;border-radius:99px}

  /* 论坛导航条 */
  .fnav{background:#e9899b;padding:8px 18px;display:flex;gap:20px;flex-wrap:wrap;
    border-left:2px solid #eba9b6;border-right:2px solid #eba9b6}
  .fnav a{color:#fff8f0;font-size:12.5px;letter-spacing:2px;text-decoration:none;cursor:pointer}
  .fnav a:hover{color:#fff;text-shadow:0 0 6px rgba(255,255,255,.6)}

  /* 主纸面 */
  .page{background:#fffdf9;border:2px solid #eba9b6;border-top:none;border-radius:0 0 16px 16px;
    padding:24px 26px 30px;box-shadow:0 14px 40px rgba(217,122,138,.16)}
  .hello{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px;margin-bottom:6px}
  .hello h2{font-size:17px;letter-spacing:3px;color:#b04a5e;font-weight:600}
  .hello h2 b{color:#d98a98;font-weight:400;font-size:13px;margin-left:8px}
  #sync{color:#5aa476;font-size:12px;letter-spacing:2px;opacity:0;transition:opacity 2s}
  .sect{margin-top:18px}
  .gh{font-size:11.5px;color:#d98a98;letter-spacing:4px;margin:18px 0 8px;font-weight:400;
    display:flex;align-items:center;gap:8px}
  .gh::after{content:"♡ ♡ ♡";font-size:9px;color:#f0c3cc;letter-spacing:3px}

  /* 条目卡片 */
  .row{display:flex;align-items:center;gap:13px;background:#fff;border:1.5px solid #f2d5da;
    border-radius:14px;padding:12px 14px;margin-bottom:9px;cursor:pointer;
    transition:transform .15s, box-shadow .15s, border-color .15s}
  .row:hover{transform:translateY(-2px);border-color:#e9899b;box-shadow:0 8px 20px rgba(217,122,138,.2)}
  .row .fvc{width:38px;height:38px;border-radius:50%;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;
    box-shadow:inset 0 -2px 0 rgba(0,0,0,.06)}
  .fvc.c1{background:#fde3e7;color:#d97a8a}.fvc.c2{background:#e3f2fd;color:#6a9ec9}
  .fvc.c3{background:#e5f4e8;color:#5aa476}.fvc.c4{background:#fff6de;color:#c9a23f}
  .fvc.c5{background:#f3e8fa;color:#a06ac9}.fvc.c6{background:#ffeede;color:#d98a4a}
  .fvc.c7{background:#ffe8dc;color:#d97a5a}.fvc.c8{background:#dff0f7;color:#5a9ab8}
  .fvc.c9{background:#efe4fa;color:#9a6ac9}.fvc.c10{background:#e8ecf7;color:#7a8ac0}
  .fvc.c11{background:#e0f4f1;color:#4fa898}.fvc.c12{background:#f5efe4;color:#a8986a}
  .row .tt{flex:1;min-width:0}
  .row .tt b{display:block;font-size:14.5px;color:#5c4a4e;font-weight:600;letter-spacing:1px}
  .row:hover .tt b{color:#b04a5e}
  .row .tt span{display:block;font-size:11.5px;color:#c0989f;margin-top:3px;letter-spacing:1px}
  .row .when{font-size:11px;color:#d9a8b0;letter-spacing:1px;white-space:nowrap}
  .row.new .tt b::after{content:"刚刚更新";color:#e9899b;font-size:10px;margin-left:10px;
    letter-spacing:2px;background:#fdeef0;padding:2px 8px;border-radius:99px}
  .row.hot{border-color:#e9899b;background:#fff8f8}
  .row.dim{cursor:not-allowed;opacity:.55;border-style:dashed}
  .row.dim .tt b{color:#b8a0a6;font-style:italic}
  .row.dim:hover{transform:none;box-shadow:none;border-color:#f2d5da}

  /* 书签 */
  .bmarks{display:flex;gap:10px;flex-wrap:wrap}
  .bm{border:1.5px solid #f2c7ce;background:#fff5f6;border-radius:99px;padding:9px 20px;font-size:13px;
    color:#b04a5e;cursor:pointer;letter-spacing:2px}
  .bm:hover{background:#fdeef0;transform:translateY(-1px)}

  /* 页脚 */
  .foot{margin-top:24px;padding-top:14px;border-top:2px dashed #f2d5da;font-size:11px;color:#c0989f;
    letter-spacing:2px;line-height:2.2}
  .foot em{color:#e9899b;font-style:normal}
  .addrline{margin-top:10px;font-size:11px;color:#d9a8b0;letter-spacing:1px;
    background:#fdf4f1;border-radius:8px;padding:7px 12px;display:inline-block}

  @media (max-width:600px){ .page{padding:18px 14px 24px} .stk{display:none} }
</style>
</head>
<body>
<div class="stk" style="top:18px;left:20px">🐰</div>
<div class="stk small" style="top:64px;left:70px;transform:rotate(-10deg)">✨</div>
<div class="stk" style="top:24px;right:26px;transform:rotate(8deg)">🌙</div>
<div class="stk small" style="top:90px;right:80px">♡</div>

<div class="wrap">
  <div class="banner">
    <h1>我的小窝<i>♡ 未读日记本</i></h1>
    <div id="clock"></div>
  </div>
  <div class="fnav">
    <a data-go="index.html">🏠 首页</a>
    <a data-go="chat.html">💌 消息(38)</a>
    <a data-go="search.html">🔍 搜搜</a>
    <a data-go="board.html">🧷 一面墙</a>
    <a data-go="radio.html">📻 电台</a>
  </div>
  <div class="page">
    <div class="hello">
      <h2 id="hello">晚上好。</h2>
      <span id="sync"></span>
    </div>

    <div class="sect" id="hist"></div>

    <div class="addrline">🔒 <b>daji://</b>local/diary · 上次同步：刚刚</div>

    <div class="foot" id="foot"></div>
  </div>
</div>
<div id="envhint"></div>
<script src="assets/game.js?v=59"></script>
<script>
if (DJ.gate(1)) main();
function main(){
  const $ = id => document.getElementById(id);
  const ch = DJ.state.chapter;
  const name = DJ.state.name || "";

  /* 问候：跟着你的真实时间走 */
  const h = new Date().getHours();
  let greet = "晚上好";
  if (h < 5) greet = "这个点，还在线";
  else if (h < 11) greet = "早上好";
  else if (h < 14) greet = "中午好";
  else if (h < 18) greet = "下午好";
  $("hello").innerHTML = greet + (name ? "，" + name : "") + " ♡";
  const tick = () => $("clock").textContent = "📒 " + new Date().toLocaleTimeString("zh-CN", {hour12:false});
  tick(); setInterval(tick, 1000);

  /* 条目：浏览痕迹，不是关卡 */
  const ENTS = [
    {c:1,  l:"电", k:"c1", t:"未接来电 · 8 次",       s:"那个号码没有署名",     h:"dial.html",  when:"8 天前"},
    {c:2,  l:"未", k:"c2", t:"未读（38）",            s:"从来只有你这边在说",   h:"chat.html",  when:"8 天前"},
    {c:3,  l:"观", k:"c3", t:"青云观 · 线上问己",     s:"香火还剩 " + DJ.state.incense + " 支", h:"guanyun.html", when:"8 天前"},
    {c:4,  l:"茶", k:"c4", t:"第八茶室 · 深夜场",     s:"营业时间：亥时",       h:"oracle.html", when:"8 天前"},
    {c:5,  l:"影", k:"c5", t:"倒影小组 Reflexion BBS",s:"当前在线 1 人",        h:"forum.html", when:"8 天前"},
    {c:6,  l:"账", k:"c6", t:"流水账",                s:"记事本 · 共 8 笔",     h:"ledger.html",when:"8 天前"},
    {c:7,  l:"猫", k:"c7", t:"猫屋 · 同城领养",       s:"分类信息 · 已举报",    h:"adopt.html", when:"8 天前"},
    {c:8,  l:"云", k:"c8", t:"云屉",                  s:"网盘 · 剩余空间 8 GB", h:"cloud.html", when:"8 天前"},
    {c:9,  l:"面", k:"c9", t:"面 具",                 s:"本机文件 · 别数错层数",h:"mask.html",  when:"8 天前"},
    {c:10, l:"档", k:"c10",t:"档 案 室",              s:"需要工牌",             h:"archive.html",when:"8 天前"},
    {c:11, l:"镜", k:"c11",t:"镜 中 人",              s:"对面显示在线",         h:"echo8.html", when:"8 天前"},
    {c:12, l:"终", k:"c12",t:"顺其自然",              s:"没有标题",             h:"final.html", when:"8 天前"}
  ];
  const hist = $("hist");
  let curGroup = null;
  const group = (label) => {
    if (curGroup === label) return;
    curGroup = label;
    const g = document.createElement("div");
    g.className = "gh";
    g.textContent = "✿ " + label;
    hist.appendChild(g);
  };
  const mkrow = (e, opts) => {
    const r = document.createElement("div");
    r.className = "row" + (opts && opts.hot ? " new hot" : "") + (opts && opts.dim ? " dim" : "");
    r.title = e.s || "";
    r.innerHTML = `<div class="fvc ${e.k}">${e.l}</div>
      <div class="tt"><b>${e.t}</b><span>${e.s}</span></div>
      <div class="when">${e.when}</div>`;
    r.onclick = opts && opts.dim
      ? () => { DJ.sfx.err(); DJ.envHintNow(e.err || "打不开。还不是时候——有些地方，要先在别处留下痕迹。"); }
      : () => { DJ.sfx.click(); location.href = e.h; };
    hist.appendChild(r);
    return r;
  };

  /* 组一：今天 */
  group("今天");
  const cur = ENTS.find(e => e.c === ch);
  if (cur) mkrow(Object.assign({}, cur, { when: "刚刚 · " + new Date().toLocaleTimeString("zh-CN",{hour:"2-digit",minute:"2-digit",hour12:false}) }), { hot: true });

  /* 组二：8 天前 */
  const past = ENTS.filter(e => e.c < ch);
  if (past.length){
    group("8 天前");
    past.forEach(e => mkrow(e));
  }

  /* 组三：更早 */
  const early = [];
  if (ch >= 9)  early.push({l:"台", k:"c8", t:"深夜电台 FM 08.8", s:"这个频道八年只播一句话", h:"radio.html", when:"每天"});
  if (ch >= 10) early.push({l:"相", k:"c7", t:"他的一晚", s:"8 张照片，和一句没发出去的话", h:"photos.html", when:"8 天前"});
  if (ch >= 10) early.push({l:"医", k:"c1", t:"第八医院 · 网上服务平台", s:"心理睡眠中心 · 夜间门诊", h:"hospital.html", when:"内网"});
  if (ch >= 10) early.push({l:"墙", k:"c6", t:"一面墙", s:"你在每一个抽屉里都捡到过一块碎片", h:"board.html", when:"待拼"});
  if (early.length){
    group("更早");
    early.forEach(e => mkrow(e));
  }

  /* 下一条：灰的，打不开，但它在动 */
  if (ch < 12){
    const nx = ENTS.find(e => e.c === ch + 1);
    group("今天");
    mkrow({t:"日记本里多了一页，不是你写的。", s:nx ? nx.s : "", l:"◌", k:"c10", when:"刚刚",
           err:"打不开。还不是时候——有些地方，要先在别处留下痕迹。"}, { dim: true });
  }

  /* 现实入侵：它知道你回来过几次 */
  const rv = DJ.rvOf("hub") || 0;
  if (DJ.revisit("hub") >= 2){
    const r = document.createElement("div");
    r.className = "row dim";
    r.innerHTML = `<div class="fvc c10">◌</div>
      <div class="tt"><b>欢迎回来。你是今天第 ${rv >= 4 ? "88" : "8"} 位访客。</b><span>本页仅你可见</span></div>
      <div class="when">刚刚</div>`;
    r.onclick = () => { DJ.sfx.err(); DJ.envHintNow("这句话的另一个意思是——今天，一个访客都没有。"); };
    hist.appendChild(r);
  }

  /* 导航 */
  document.querySelectorAll(".fnav a").forEach(b => b.onclick = () => { DJ.sfx.click(); location.href = b.dataset.go; });

  /* 页脚：设备所有者 */
  $("foot").innerHTML =
    `本日记本所有者：${name ? name : "（没有留名字的人）"} · 上次在线：刚刚 ♡<br>` +
    `同步状态：<em>日记在另一台设备上也会更新。你删不掉。</em>`;

  /* 同步提示 */
  if (ch >= 1){
    setTimeout(() => {
      $("sync").textContent = "✿ 刚刚同步了一条新记录";
      $("sync").style.opacity = 1;
      setTimeout(() => $("sync").style.opacity = 0, 6000);
    }, 900);
  }

  DJ.envHint("这本日记记得一切。包括你不记得的部分。", "hb1", 120);
  DJ.envHint("有些页，要你在别的地方留下痕迹之后，才会写上。", "hb2", 260);
}
</script>
</body>
</html>
