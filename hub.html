<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>新标签页</title>
<link rel="stylesheet" href="assets/style.css?v=57">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden}
  body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:#04070d;color:#dfe5ee;
       -webkit-user-select:none;user-select:none}

  /* ---------- 开机 ---------- */
  #boot{position:fixed;inset:0;background:#000;z-index:900;display:flex;align-items:center;justify-content:center;cursor:pointer}
  #boot.off{display:none}
  #bootInner{font-family:var(--mono,monospace);font-size:13px;color:#7e90ad;line-height:2.2;letter-spacing:1px;min-width:280px}
  #bootInner .ok{color:#4f8f6b}
  #power{width:56px;height:56px;border:2px solid #2c3a52;border-radius:50%;margin:0 auto 26px;
    display:flex;align-items:center;justify-content:center;color:#8fa0bd;font-size:22px;
    animation:pulse 2.4s ease infinite}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(143,160,189,.18)}50%{box-shadow:0 0 0 12px rgba(143,160,189,0)}}
  #bootHint{text-align:center;color:#33415e;font-size:12px;letter-spacing:3px;margin-top:26px}

  /* ---------- 锁屏 ---------- */
  #lock{position:fixed;inset:0;z-index:800;display:none;flex-direction:column;align-items:center;justify-content:center;
    background:radial-gradient(1200px 700px at 30% 20%,#12203c 0%,#0a1226 45%,#050a16 100%)}
  #lock.on{display:flex}
  #lock::after{content:"X";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-size:44vmin;font-weight:700;color:rgba(143,160,189,.05);pointer-events:none;letter-spacing:0}
  .lockTime{font-size:74px;font-weight:200;letter-spacing:4px;font-variant-numeric:tabular-nums}
  .lockDate{color:#5a6a84;font-size:15px;letter-spacing:3px;margin-top:6px}
  .lockAva{width:84px;height:84px;border-radius:50%;margin:56px 0 12px;
    background:linear-gradient(150deg,#1a2b4d,#0c1730);border:1px solid #2c3a52;
    display:flex;align-items:center;justify-content:center;font-size:30px;color:#8fa0bd;letter-spacing:4px}
  .lockName{font-size:16px;letter-spacing:8px;color:#aebfd8}
  #pwRow{margin-top:22px;display:flex;gap:10px;align-items:center}
  #pw{background:rgba(255,255,255,.06);border:1px solid #2c3a52;border-radius:99px;color:#dfe5ee;
    padding:11px 20px;font-size:15px;letter-spacing:6px;width:210px;text-align:center;outline:none;font-family:var(--mono,monospace)}
  #pw:focus{border-color:#4a7dd6}
  #pw.shake{animation:shk .38s}
  @keyframes shk{0%,100%{transform:none}25%{transform:translateX(-9px)}75%{transform:translateX(9px)}}
  #pwHint{margin-top:16px;color:#33415e;font-size:12.5px;letter-spacing:2px;min-height:18px}
  #pwHint.warn{color:#8a6d3a}
  #pwHint.creep{color:#7a4040}

  /* ---------- 桌面 ---------- */
  #desktop{position:fixed;inset:0;display:none;
    background:radial-gradient(1300px 800px at 28% 18%,#152648 0%,#0c1730 48%,#060c1a 100%)}
  #desktop.on{display:block}
  #desktop::after{content:"X";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-size:44vmin;font-weight:700;color:rgba(143,160,189,.045);pointer-events:none}

  .dicon{position:absolute;width:86px;padding:10px 4px 8px;border-radius:8px;text-align:center;cursor:pointer;
    transition:background .15s}
  .dicon:hover{background:rgba(143,160,189,.09)}
  .dicon .tile{width:52px;height:52px;margin:0 auto 7px;border-radius:11px;display:flex;align-items:center;justify-content:center;
    font-size:20px;font-weight:600;color:#eef2f9;box-shadow:0 4px 14px rgba(0,0,0,.35)}
  .dicon b{display:block;font-size:12px;font-weight:400;letter-spacing:1px;color:#c9d6ea;line-height:1.5;
    text-shadow:0 1px 3px rgba(0,0,0,.7);word-break:keep-all}
  .dicon.lockd{opacity:.32;filter:grayscale(.6)}
  .dicon.lockd b{color:#5a6a84}

  /* 便利贴 */
  #note{position:absolute;right:26px;top:30px;width:168px;padding:16px 14px 40px;background:#e9d788;color:#4a3f1d;
    font-size:13.5px;line-height:2;letter-spacing:1px;transform:rotate(-2.5deg);
    box-shadow:0 8px 24px rgba(0,0,0,.45);cursor:default;z-index:5}
  #note::before{content:"";position:absolute;top:-9px;left:50%;transform:translateX(-50%) rotate(2deg);
    width:70px;height:18px;background:rgba(255,255,255,.45)}
  #note .sig{text-align:right;margin-top:8px;color:#6b5c28}

  /* ---------- 窗口 ---------- */
  .win{position:fixed;min-width:300px;max-width:92vw;background:#0e1524;border:1px solid #24304a;border-radius:10px;
    box-shadow:0 24px 70px rgba(0,0,0,.6);overflow:hidden;display:none;z-index:100}
  .win.show{display:block;animation:winIn .18s ease}
  @keyframes winIn{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
  .win .wbar{background:#131c30;border-bottom:1px solid #24304a;padding:9px 12px;display:flex;align-items:center;gap:8px;cursor:move}
  .win .wdots{display:flex;gap:6px}
  .win .wdots i{width:11px;height:11px;border-radius:50%}
  .win .wdots i:nth-child(1){background:#c0564f;cursor:pointer}
  .win .wdots i:nth-child(2){background:#b8a35a}
  .win .wdots i:nth-child(3){background:#4f8f6b}
  .win .wtitle{flex:1;text-align:center;font-size:12.5px;color:#8fa0bd;letter-spacing:2px}
  .win .wbody{padding:18px 20px;max-height:56vh;overflow:auto;font-size:13.5px;line-height:2;color:#c9d6ea;letter-spacing:.5px}
  .win .wbody::-webkit-scrollbar{width:8px}
  .win .wbody::-webkit-scrollbar-thumb{background:#24304a;border-radius:4px}
  .frow{display:flex;align-items:center;gap:12px;padding:10px 8px;border-radius:8px;cursor:pointer;transition:background .15s}
  .frow:hover{background:rgba(143,160,189,.08)}
  .frow .fi{width:34px;height:34px;border-radius:8px;flex-shrink:0;display:flex;align-items:center;justify-content:center;
    font-size:15px;font-weight:600}
  .frow b{font-weight:400;font-size:13.5px;color:#dfe5ee;letter-spacing:1px}
  .frow span{margin-left:auto;font-size:11px;color:#42536f;letter-spacing:1px}
  .docTitle{color:#8fa0bd;font-size:12px;letter-spacing:3px;border-bottom:1px dashed #24304a;padding-bottom:8px;margin-bottom:12px}
  .docBody{white-space:pre-wrap}
  .docBody em{color:#7e90ad;font-style:normal}
  .frow .fi, .dicon .tile{font-family:-apple-system,"PingFang SC",sans-serif}

  /* ---------- 任务栏 ---------- */
  #taskbar{position:fixed;left:0;right:0;bottom:0;height:46px;z-index:600;display:none;
    background:rgba(10,16,30,.82);backdrop-filter:blur(18px);border-top:1px solid rgba(36,48,74,.8);
    align-items:center;padding:0 12px;gap:8px}
  #taskbar.on{display:flex}
  #startBtn{padding:7px 14px;border-radius:7px;cursor:pointer;font-size:13.5px;letter-spacing:1px;color:#aebfd8}
  #startBtn:hover{background:rgba(143,160,189,.12)}
  #taskWins{flex:1;display:flex;gap:6px;overflow:hidden}
  .twin{padding:6px 12px;border-radius:7px;font-size:12px;color:#8fa0bd;background:rgba(143,160,189,.07);
    cursor:pointer;letter-spacing:1px;white-space:nowrap;max-width:150px;overflow:hidden;text-overflow:ellipsis}
  .twin.act{background:rgba(74,125,214,.22);color:#dfe5ee}
  #tClock{text-align:right;font-size:12px;color:#8fa0bd;line-height:1.5;letter-spacing:1px;font-variant-numeric:tabular-nums}
  #tClock b{display:block;font-weight:500;color:#c9d6ea}

  /* 开始菜单 */
  #startmenu{position:fixed;left:10px;bottom:54px;width:250px;background:rgba(14,21,36,.96);backdrop-filter:blur(20px);
    border:1px solid #24304a;border-radius:12px;padding:10px;z-index:700;display:none;box-shadow:0 20px 60px rgba(0,0,0,.6)}
  #startmenu.show{display:block;animation:winIn .15s ease}
  .smItem{padding:10px 12px;border-radius:8px;font-size:13px;color:#c9d6ea;letter-spacing:2px;cursor:pointer}
  .smItem:hover{background:rgba(143,160,189,.1)}
  .smSep{border-top:1px solid #1c2942;margin:6px 4px}

  /* 通知 */
  #notif{position:fixed;right:14px;bottom:58px;width:280px;background:rgba(14,21,36,.97);border:1px solid #2c3a52;
    border-radius:12px;padding:14px 16px;z-index:700;font-size:12.5px;line-height:1.9;letter-spacing:1px;color:#c9d6ea;
    display:none;box-shadow:0 18px 50px rgba(0,0,0,.55)}
  #notif.show{display:block;animation:winIn .25s ease}
  #notif b{color:#8fa0bd;font-weight:400;font-size:11px;letter-spacing:2px;display:block;margin-bottom:6px}

  @media (max-width:640px){
    .lockTime{font-size:52px}
    .dicon{width:72px}
    .dicon .tile{width:44px;height:44px;font-size:16px}
    #note{display:none}
  }
</style>
</head>
<body>

<!-- 开机 -->
<div id="boot">
  <div id="bootInner">
    <div id="power">⏻</div>
    <div id="bootHint">按任意键开机</div>
  </div>
</div>

<!-- 锁屏 -->
<div id="lock">
  <div class="lockTime" id="lkT">--:--</div>
  <div class="lockDate" id="lkD"></div>
  <div class="lockAva">X</div>
  <div class="lockName">X</div>
  <div id="pwRow">
    <input id="pw" type="password" maxlength="8" autocomplete="off" placeholder="密码">
    <div style="color:#33415e;font-size:18px">→</div>
  </div>
  <div id="pwHint"></div>
</div>

<!-- 桌面 -->
<div id="desktop"></div>

<!-- 便利贴 -->
<div id="note" style="display:none">
  密码别写在便利贴上。<br>说了多少次了。<div class="sig">—— X</div>
</div>

<!-- 任务栏 -->
<div id="taskbar">
  <div id="startBtn"> ⊞ 开始</div>
  <div id="taskWins"></div>
  <div id="tClock"><b id="tcT">--:--</b><span id="tcD"></span></div>
</div>

<!-- 开始菜单 -->
<div id="startmenu">
  <div class="smItem" data-go="search.html">🔍 搜 索</div>
  <div class="smItem" data-go="board.html">🧷 一面墙</div>
  <div class="smItem" data-go="radio.html">📻 深夜电台</div>
  <div class="smSep"></div>
  <div class="smItem" id="smOff">⏻ 关 机</div>
</div>

<!-- 通知 -->
<div id="notif"><b>系统通知</b><span id="notifTxt"></span></div>

<script src="assets/game.js?v=57"></script>
<script>
  const $ = id => document.getElementById(id);
  const ch = DJ.state.chapter || 1;

  /* ============ 时钟 ============ */
  const WK = "日一二三四五六";
  function tick(){
    const n = new Date();
    const p = x => String(x).padStart(2,"0");
    $("lkT").textContent = p(n.getHours()) + ":" + p(n.getMinutes());
    $("tcT").textContent = p(n.getHours()) + ":" + p(n.getMinutes()) + ":" + p(n.getSeconds());
    const d = n.getFullYear() + "年" + (n.getMonth()+1) + "月" + n.getDate() + "日" + " 星期" + WK[n.getDay()];
    $("lkD").textContent = d;
    $("tcD").textContent = (n.getMonth()+1) + "/" + n.getDate();
  }
  setInterval(tick, 1000); tick();

  /* ============ 开机 ============ */
  const BOOT = [
    "ECHO BIOS  v8.08",
    "内存检测 …… <span class='ok'>8192MB OK</span>",
    "磁盘检测 …… <span class='ok'>发现 1 个未命名卷</span>",
    "正在恢复上次会话 ……",
    "有一个程序在开机时自动运行了。<span class='ok'>已允许。</span>"
  ];
  let booted = false;
  $("boot").onclick = () => {
    if (booted) return; booted = true;
    DJ.sfx.click();
    const inner = $("bootInner");
    inner.innerHTML = "";
    $("power").style.display = "none"; $("bootHint").style.display = "none";
    let i = 0;
    const line = () => {
      if (i < BOOT.length){
        const d = document.createElement("div");
        d.innerHTML = "&gt; " + BOOT[i];
        inner.appendChild(d); i++;
        setTimeout(line, i === 1 ? 900 : 650);
      } else {
        setTimeout(() => { $("boot").classList.add("off"); showLock(); }, 900);
      }
    };
    line();
  };

  /* ============ 锁屏 ============ */
  if (sessionStorage.getItem("daji_unlocked")) { skipToDesktop(); }
  function skipToDesktop(){ $("boot").classList.add("off"); enterDesktop(true); }
  function showLock(){ $("lock").classList.add("on"); setTimeout(()=>$("pw").focus(), 300); }
  let fails = 0;
  function tryPw(){
    const v = $("pw").value.trim();
    const hint = $("pwHint");
    if (v === "0808"){
      DJ.sfx.ok();
      sessionStorage.setItem("daji_unlocked","1");
      if (fails === 0){ DJ.flag("pw_first_try"); }
      $("lock").classList.remove("on");
      enterDesktop(false);
      return;
    }
    if (!v) return;
    DJ.sfx.err();
    fails++;
    $("pw").classList.add("shake");
    setTimeout(()=>$("pw").classList.remove("shake"), 400);
    $("pw").value = ""; $("pw").focus();
    if (fails === 1) { hint.className=""; hint.textContent = "密码错误。"; }
    else if (fails === 2){ hint.className="warn"; hint.textContent = "（提示：四个数字。他不肯忘记的那一天。）"; }
    else if (fails === 3){ hint.className="creep"; hint.textContent = "……你怎么会不知道这个日期？"; }
    else { hint.className="creep"; hint.textContent = "0。8。0。8。"; }
  }
  $("pw").addEventListener("keydown", e => { if (e.key === "Enter") tryPw(); });

  /* ============ 图标数据 ============ */
  const CN = ["#3b5a8f","#4f8f6b","#8a5a8f","#8f6b3b","#3b7a8f","#8f3b52","#5a8f3b","#6b6b8f",
              "#8f7a3b","#3b6b8f","#7a3b6b","#4a8f7a","#8f5a3b","#44598f","#6f8f4a"];
  const ICONS = [
    {id:"pc",   l:"此电脑",   act:()=>openPC()},
    {id:"bin",  l:"回收站",   act:()=>openBin()},
    {id:"docs", l:"未命名",   act:()=>openDocs()},
    {id:"chat", l:"WChat",    h:"chat.html",  need:2},
    {id:"dial", l:"通话记录", h:"dial.html",  need:1},
    {id:"guan", l:"青云观",   h:"guanyun.html",need:3},
    {id:"ora",  l:"第八茶室", h:"oracle.html", need:4},
    {id:"forum",l:"倒影小组", h:"forum.html",  need:5},
    {id:"led",  l:"流水账",   h:"ledger.html", need:6},
    {id:"adopt",l:"猫屋领养", h:"adopt.html",  need:7},
    {id:"cloud",l:"云屉",     h:"cloud.html",  need:8},
    {id:"mask", l:"面具.jpg", h:"mask.html",   need:9},
    {id:"arch", l:"档案室",   h:"archive.html",need:10},
    {id:"echo", l:"ECHO",     h:"echo8.html",  need:11},
    {id:"fin",  l:"顺其自然", h:"final.html",  need:12}
  ];
  const SIDE = [
    {l:"深夜电台", h:"radio.html",   need:9},
    {l:"他的一晚", h:"photos.html",  need:10},
    {l:"第八医院", h:"hospital.html",need:10},
    {l:"一面墙",   h:"board.html",   need:10}
  ];

  /* ============ 桌面渲染 ============ */
  function enterDesktop(skipBoot){
    $("desktop").classList.add("on");
    $("taskbar").classList.add("on");
    if (!skipBoot) DJ.sfx.ok();
    renderIcons();
    positionIcons();
    if (ch >= 10) { $("note").style.display = "block"; notify(); }
  }

  function renderIcons(){
    const desk = $("desktop");
    desk.querySelectorAll(".dicon").forEach(n=>n.remove());
    const all = [];
    ICONS.forEach((e,idx) => {
      const ok = !e.need || ch >= e.need;
      all.push({e, ok});
    });
    SIDE.forEach((e) => {
      if (ch >= e.need) all.push({e, ok:true});
    });
    all.forEach((item, i) => {
      const d = document.createElement("div");
      d.className = "dicon" + (item.ok ? "" : " lockd");
      const letter = item.e.l.slice(0,1);
      d.innerHTML = '<div class="tile" style="background:' + CN[i % CN.length] + '">' + (item.ok ? letter : "锁") + '</div><b>' + item.e.l + '</b>';
      d.onclick = () => {
        if (!item.ok){ DJ.sfx.err(); toastWin("打不开。还不是时候——有些地方，要先在别处留下痕迹。"); return; }
        DJ.sfx.click();
        if (item.e.h) location.href = item.e.h;
        else item.e.act();
      };
      desk.appendChild(d);
    });
  }
  function positionIcons(){
    const icons = [...document.querySelectorAll(".dicon")];
    const perCol = Math.max(4, Math.floor((window.innerHeight - 90) / 108));
    icons.forEach((el,i) => {
      const col = Math.floor(i / perCol), row = i % perCol;
      el.style.left = (16 + col * 98) + "px";
      el.style.top  = (16 + row * 108) + "px";
    });
  }
  window.addEventListener("resize", () => { if($("desktop").classList.contains("on")) positionIcons(); });

  /* ============ 窗口管理器 ============ */
  let zTop = 100;
  const openWins = {};
  function makeWin(id, title, bodyHTML, w){
    if (openWins[id]){ focusWin(id); return openWins[id]; }
    const wEl = document.createElement("div");
    wEl.className = "win";
    wEl.style.width = (w || 380) + "px";
    wEl.style.left = Math.max(20, Math.min(window.innerWidth - (w||380) - 30, 90 + Object.keys(openWins).length * 34)) + "px";
    wEl.style.top  = (60 + Object.keys(openWins).length * 28) + "px";
    wEl.innerHTML = '<div class="wbar"><div class="wdots"><i class="wclose"></i><i></i><i></i></div>' +
      '<div class="wtitle">' + title + '</div><div style="width:39px"></div></div>' +
      '<div class="wbody">' + bodyHTML + '</div>';
    document.body.appendChild(wEl);
    const bar = wEl.querySelector(".wbar");
    let sx,sy,ox,oy,drag=false;
    bar.addEventListener("mousedown", e => {
      drag=true; sx=e.clientX; sy=e.clientY;
      ox=parseInt(wEl.style.left); oy=parseInt(wEl.style.top);
      wEl.style.zIndex = ++zTop;
    });
    window.addEventListener("mousemove", e => {
      if (!drag) return;
      wEl.style.left = Math.max(0, ox + e.clientX - sx) + "px";
      wEl.style.top  = Math.max(0, oy + e.clientY - sy) + "px";
    });
    window.addEventListener("mouseup", () => drag = false);
    wEl.addEventListener("mousedown", () => wEl.style.zIndex = ++zTop);
    wEl.querySelector(".wclose").onclick = e => {
      e.stopPropagation();
      wEl.remove(); delete openWins[id];
      const t = document.querySelector('.twin[data-w="' + id + '"]'); if (t) t.remove();
    };
    const t = document.createElement("div");
    t.className = "twin"; t.dataset.w = id; t.textContent = title;
    t.onclick = () => {
      if (wEl.style.display === "none"){ wEl.style.display="block"; t.classList.add("act"); }
      else { wEl.style.display="none"; t.classList.remove("act"); }
    };
    $("taskWins").appendChild(t);
    openWins[id] = wEl;
    wEl.style.zIndex = ++zTop;
    wEl.classList.add("show");
    return wEl;
  }
  function focusWin(id){ const w=openWins[id]; if(w) w.style.zIndex = ++zTop; }

  function toastWin(txt){
    makeWin("toast","系统提示",
      '<div style="letter-spacing:1px;line-height:2.2">' + txt + '</div>', 300);
  }

  /* ============ 此电脑 ============ */
  function openPC(){
    makeWin("pc","此电脑",
      '<div class="docTitle">本地存储 · 3 个卷</div>' +
      '<div class="frow" id="dDrive"><div class="fi" style="background:#3b5a8f">D:</div>' +
        '<b>未命名 (D:)</b><span>8.08 GB 可用</span></div>' +
      '<div class="frow" id="cDrive"><div class="fi" style="background:#44598f">C:</div>' +
        '<b>系统 (C:)</b><span>已用 8.08 GB</span></div>' +
      '<div class="frow" id="eDrive"><div class="fi" style="background:#4a3b3b">E:</div>' +
        '<b>可移动磁盘 (E:)</b><span>无法访问</span></div>' +
      '<div style="margin-top:12px;color:#42536f;font-size:12px;letter-spacing:1px" id="eMsg"></div>', 400);
    $("dDrive").onclick = () => openDocs();
    $("eDrive").onclick = () => {
      DJ.sfx.err();
      $("eMsg").innerHTML = "<em>无法访问：请插入原始设备。它只被插上过一次——2025 年 8 月 8 日 00:08。</em>";
    };
  }

  /* ============ 回收站 ============ */
  const BIN = [
    {n:"和大吉的聊天记录_旧.txt", t:"文本",
     b:"<em>（这份聊天记录被手动删除了。删除时间：2921 天前，之后又被恢复过 8 次。）</em>\n\n「在吗」\n「在」\n「今天猫粮打折，我囤了两袋」\n「嗯」\n「你不问我为什么囤两袋吗」\n\n<em>（记录到这里断了。最后一条是：对方撤回了一条消息。）</em>"},
    {n:"草稿(1).txt", t:"文本",
     b:"其实我\n\n<em>（这个文档被打开过 2921 次。内容只有三个字。\n第 2921 次打开的时间是：昨天 23:52。）</em>"},
    {n:"面具备份.jpg.bak", t:"已损坏",
     b:"<em>（文件已损坏，无法预览。）</em>\n\n只剩一行元数据：\n拍摄于 00:08 · 对不起"}
  ];
  function openBin(){
    const rows = BIN.map((f,i) =>
      '<div class="frow" onclick="showBinDoc(' + i + ')"><div class="fi" style="background:#4a3b3b">' +
      (f.t==="文本" ? "文" : "✕") + '</div><b>' + f.n + '</b><span>' + f.t + '</span></div>').join("");
    makeWin("bin","回收站",'<div class="docTitle">3 个项目 · 从未被清空</div>' + rows, 420);
  }
  function showBinDoc(i){
    const f = BIN[i];
    makeWin("bindoc"+i, f.n, '<div class="docBody">' + f.b + '</div>', 380);
  }
  window.showBinDoc = showBinDoc;

  /* ============ D 盘 · 未命名文件夹 ============ */
  function openDocs(){
    const files = [];
    if (ch >= 1) files.push({n:"通话记录.txt", b:"<em>（导出于昨天深夜。）</em>\n\n同一个号码，未接来电 8 次。\n通话时长：8 秒。没有说话。\n\n<em>（备注栏是空的。从来都是空的。）</em>"});
    if (DJ.has("found_floor8")) files.push({n:"便利贴.png", b:"<em>（一张翻拍的照片。）</em>\n\n便签上手写着四个字：\n\n亥时三刻\n\n<em>（字迹鉴定报告显示：和档案里那份测试卷，同一执笔人。99.7%）</em>"});
    if (ch >= 6) files.push({n:"账本导出.csv", b:"八笔流水。合计：\n\n80808\n\n<em>（最后一笔的备注：不止是钱。）</em>"});
    if (ch >= 7) files.push({n:"领养页截图.png", b:"<em>（你举报那个帖子时存下的。）</em>\n\n坐标：N38°45′08″ E93°23′08″\n\n<em>（这个坐标是真的。）</em>"});
    if (ch >= 10) files.push({n:"病历_08-0808.pdf", b:"心理睡眠中心 · 病历号 08-0808\n\n八次复诊。全部约在同一位医生的 08:08。\n主诉一栏，从「睡不好」一路改，最后一次写着：\n\n「没什么好说的。都记在别的地方了。」\n\n<em>（末次随访：失约。医生手写：他没有失约。他只是觉得，不需要了。）</em>"});
    if (DJ.has("board_done")) files.push({n:"一面墙.kb", b:"<em>（你已经把八块碎片钉上去了。）</em>\n\n他把能上锁的地方全部锁在了同一天。\n不是忘不了那天——\n是怕哪天，连这一天自己也忘了。"});
    if (!files.length) files.push({n:"（空）", b:"<em>（这个文件夹里还没有东西。你每查清一件事，这里就会多一份文件。）</em>"});
    const rows = files.map((f,i) =>
      '<div class="frow" onclick="showKbDoc(' + i + ')"><div class="fi" style="background:#4f8f6b">文</div>' +
      '<b>' + f.n + '</b><span>刚刚同步</span></div>').join("");
    makeWin("docs","未命名 (D:)","<div class='docTitle'>D:\\未命名 · " + files.length + " 个文件</div>" + rows, 420);
    window._KB = files;
  }
  function showKbDoc(i){
    const f = window._KB[i];
    makeWin("kbdoc"+i, f.n, '<div class="docBody">' + f.b + '</div>', 380);
  }
  window.showKbDoc = showKbDoc;

  /* ============ 开始菜单 / 关机 ============ */
  $("startBtn").onclick = e => { e.stopPropagation(); $("startmenu").classList.toggle("show"); };
  document.addEventListener("click", e => {
    if (!e.target.closest("#startmenu") && !e.target.closest("#startBtn")) $("startmenu").classList.remove("show");
  });
  document.querySelectorAll(".smItem[data-go]").forEach(b => {
    b.onclick = () => { DJ.sfx.click(); location.href = b.dataset.go; };
  });
  $("smOff").onclick = () => {
    $("startmenu").classList.remove("show");
    makeWin("off","正在关机",
      '<div style="text-align:center;padding:26px 0;letter-spacing:3px" id="offTxt">正在关机……</div>', 300);
    setTimeout(() => {
      const o = document.querySelector("#offTxt");
      if (o) o.innerHTML = "<em>它没有关。<br><br>有一个程序在开机时自动运行了。已允许。已允许。已允许。</em>";
      DJ.sfx.err();
    }, 2600);
  };

  /* ============ 通知 ============ */
  let notified = false;
  function notify(){
    if (notified) return; notified = true;
    setTimeout(() => {
      $("notifTxt").textContent = "欢迎回来。你是今天第 8 位访客。——今天，一个访客都没有。";
      $("notif").classList.add("show");
      setTimeout(()=>$("notif").classList.remove("show"), 6000);
    }, 2200);
  }

  /* ============ 氛围提示 ============ */
  DJ.envHint("这台机器记得一切。包括你不记得的部分。", "hubA", 150);
  DJ.envHint("回收站从没被清空过。有些人删除，只是为了假装删过。", "hubB", 300);
</script>
</body>
</html>
