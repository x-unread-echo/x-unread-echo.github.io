<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>对方手机</title>
<link rel="stylesheet" href="assets/style.css?v=55">
<style>
  body{background:#04060b;overflow:hidden}
  .stage{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 14px}
  .hint-top{color:#33415e;font-size:12px;letter-spacing:4px;margin-bottom:18px;text-align:center}
  .phone{width:320px;max-width:92vw;height:600px;border:1px solid #1c2c4a;border-radius:34px;
    background:linear-gradient(165deg,#0a0f19 0%,#060a12 100%);
    box-shadow:0 30px 90px rgba(0,0,0,.75), inset 0 1px 0 rgba(174,191,216,.06);
    padding:26px 18px 30px;position:relative;overflow:hidden;cursor:pointer;user-select:none}
  .notch{position:absolute;top:12px;left:50%;transform:translateX(-50%);width:90px;height:16px;
    background:#04060b;border-radius:10px;border:1px solid #131c2e}
  .clock{color:#42536f;font-size:11px;letter-spacing:3px;text-align:right;font-family:var(--mono)}
  .sname{color:#dfe5ee;font-size:15px;letter-spacing:3px;text-align:center;margin-top:14px;font-weight:300}
  .sstatus{color:#33415e;font-size:10.5px;letter-spacing:2px;text-align:center;margin-top:5px}
  .screen{margin-top:16px;animation:scrfade .9s ease both}
  @keyframes scrfade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .bub{max-width:78%;padding:8px 13px;border-radius:14px;font-size:12.5px;line-height:1.8;
    margin:7px 0;color:#9fb0ca;background:#0e1626;border:1px solid #16233c;letter-spacing:1px}
  .bub.me{margin-left:auto;background:#16233c;color:#c9d6ea}
  .sys{color:#33415e;font-size:10.5px;letter-spacing:2px;text-align:center;margin:12px 0}
  .draftbox{border:1px solid #22304a;border-radius:10px;padding:10px 12px;margin-top:14px}
  .draftbox .k{color:#33415e;font-size:10px;letter-spacing:2px}
  .draftbox .v{color:#aebfd8;font-size:13.5px;letter-spacing:2px;margin-top:5px;min-height:20px}
  .cursor{display:inline-block;width:1px;height:16px;background:#aebfd8;vertical-align:-3px;
    animation:blink 1s step-start infinite}
  @keyframes blink{50%{opacity:0}}
  .alarmline{display:flex;justify-content:space-between;align-items:baseline;
    border-top:1px solid #131c2e;padding:13px 4px}
  .alarmline .t{color:#dfe5ee;font-family:var(--mono);font-size:26px;letter-spacing:3px}
  .alarmline .n{color:#5a6a84;font-size:12px;letter-spacing:3px}
  .typing{color:#6d80a0;font-size:11.5px;letter-spacing:2px;padding:6px 2px;min-height:24px}
  .recalled{color:#33415e;font-size:11.5px;letter-spacing:2px;text-align:center;font-style:italic}
  .nextcue{margin-top:22px;color:#2c3a52;font-size:11px;letter-spacing:5px;text-align:center;
    animation:cue 2.6s ease infinite}
  @keyframes cue{0%,100%{opacity:.35}50%{opacity:.9}}
  .final-text{max-width:560px;margin-top:34px;text-align:center;display:none}
  .final-text.show{display:block}
  .fl{color:#c9d6ea;font-size:16px;line-height:2.5;letter-spacing:2px;opacity:0;
    transform:translateY(10px);transition:all 1.2s}
  .fl.on{opacity:1;transform:none}
  .fl.red{color:#e8b5b0}
  .tofinal{margin-top:34px;background:none;border:1px solid #2c3a52;color:#aebfd8;
    padding:12px 38px;border-radius:3px;cursor:pointer;letter-spacing:4px;font-size:14px;
    opacity:0;transition:opacity 1.4s,border-color .3s;display:none}
  .tofinal.show{display:inline-block;opacity:1}
  .tofinal:hover{border-color:#4a7dd6}
  .skip{position:fixed;right:14px;bottom:12px;color:#22304a;font-size:10.5px;letter-spacing:2px;
    cursor:pointer;text-decoration:underline dotted;display:none}
  .skip.show{display:block}
</style>
</head>
<body>
<div class="stage">
  <div class="hint-top" id="hintTop">你看到了他的聊天记录。现在，把手机翻过来。</div>

  <div class="phone" id="phone">
    <div class="notch"></div>
    <div class="clock" id="clock">23:47</div>
    <div class="sname" id="sname">闻笛</div>
    <div class="sstatus" id="sstatus"></div>
    <div class="screen" id="screen"></div>
    <div class="nextcue" id="cue">点一下屏幕</div>
  </div>

  <div class="final-text" id="finalText">
    <div class="fl">他不是没有回。</div>
    <div class="fl">他是把「回」这个字，过成了日子。</div>
    <div class="fl red">这一页没有谜题。这一页，是他给你的。</div>
  </div>
  <button class="tofinal" id="tofinal">去 见 他 →</button>
</div>
<div class="skip" id="skip">跳过这一页 →</div>

<script>
if (DJ.gate(11)) main();
function main(){
  DJ.revisit("hisview");
  const $ = id => document.getElementById(id);
  const esc = s => s.replace(/\n/g,"<br>");
  let step = 0, lock = false;

  const steps = [
    /* 0 · 未读 38 */
    {clock:"23:47", name:"闻笛", st:"未读消息 (38)", cue:"点一下屏幕",
     html:`<div class="bub">在吗</div><div class="bub">我好难受</div>
           <div class="bub">说不上来哪里难受。就是难受。</div>
           <div class="sys">还有 34 条未读</div>
           <div class="draftbox"><div class="k">他做的第一件事：</div>
           <div class="v">从头到尾，一条一条，翻到第七遍。</div></div>`},
    /* 1 · 输入框草稿 */
    {clock:"23:52", name:"闻笛", st:"在线", cue:"点一下屏幕",
     html:`<div class="bub me">你为什么不回我</div><div class="bub me">你是不是在骗我</div>
           <div class="draftbox"><div class="k">他打了五个字，打了两分钟：</div>
           <div class="v"><span id="draft"></span><span class="cursor"></span></div>
           <div class="k" style="margin-top:6px">然后按了保存，不是发送。</div></div>`},
    /* 2 · 删掉 */
    {clock:"23:58", name:"闻笛", st:"在线", cue:"点一下屏幕",
     html:`<div class="sys">草稿已删除</div>
           <div class="sys">第 2921 天，重新开始计数。</div>
           <div class="bub me">没事了。我很好。真的。</div>
           <div class="draftbox"><div class="k">他退出去，打开了另一个软件：</div>
           <div class="v">同城领养 · 一只白色的猫</div>
           <div class="k" style="margin-top:6px">看了四分钟。没有联系卖家。</div></div>`},
    /* 3 · 电台 */
    {clock:"00:01", name:"闻笛", st:"对方频道：FM 08.8", cue:"点一下屏幕",
     html:`<div class="bub">「各位，晚安。」</div>
           <div class="bub me">晚安。</div>
           <div class="sys">这一句，他说给了黑掉的屏幕。没有人听见。</div>`},
    /* 4 · 闹钟 */
    {clock:"00:08", name:"闹钟", st:"1 个闹钟 · 已开启", cue:"点一下屏幕",
     html:`<div class="alarmline"><span class="t">08:08</span><span class="n">备注：大吉</span></div>
           <div class="sys">每天。八年。没有一天响过空。</div>
           <div class="sys">铃声是那首没有名字的钢琴曲。倒着放。</div>`},
    /* 5 · 最后一眼 */
    {clock:"00:09", name:"闻笛", st:"在线", cue:"点一下屏幕",
     html:`<div class="bub me">在吗</div>
           <div class="sys">已读。</div>
           <div class="typing" id="typing">对方正在输入…</div>`},
    /* 6 · 撤回 */
    {clock:"00:09", name:"闻笛", st:"在线", cue:"", final:true,
     html:`<div class="bub me">在吗</div>
           <div class="sys">已读。</div>
           <div class="recalled">对方撤回了一条消息</div>
           <div class="sys" style="margin-top:20px">屏幕熄灭。</div>`}
  ];

  function render(i){
    const s = steps[i];
    $("clock").textContent = s.clock;
    $("sname").textContent = s.name;
    $("sstatus").textContent = s.st;
    $("cue").textContent = s.cue;
    const sc = $("screen");
    sc.style.animation = "none"; void sc.offsetWidth; sc.style.animation = "";
    sc.innerHTML = s.html;
    DJ.sfx.type();
    if (i === 1) typeDraft();
    if (i === 5) setTimeout(() => { const t = $("typing"); if (t) t.style.opacity = ".4"; }, 2200);
    if (s.final){
      lock = true;
      setTimeout(showEnd, 2600);
    }
  }

  function typeDraft(){
    const target = "其实我";
    const el = $("draft");
    let k = 0;
    const t = setInterval(() => {
      el.textContent = target.slice(0, ++k);
      DJ.sfx.type();
      if (k >= target.length) clearInterval(t);
    }, 420);
  }

  function showEnd(){
    $("hintTop").style.opacity = 0;
    $("phone").style.transition = "opacity 1.6s, transform 1.6s";
    $("phone").style.opacity = .18;
    $("phone").style.transform = "scale(.96)";
    $("finalText").classList.add("show");
    const fls = document.querySelectorAll(".fl");
    fls.forEach((f, i) => setTimeout(() => { f.classList.add("on"); DJ.sfx.type(); }, 600 + i * 1800));
    setTimeout(() => {
      $("tofinal").classList.add("show");
      $("skip").classList.add("show");
      DJ.flag("hisview_done");
    }, 600 + fls.length * 1800 + 800);
  }

  $("phone").onclick = () => {
    if (lock || step >= steps.length - 1) { if (!lock && step === steps.length - 1){ lock = true; render(step); } return; }
    DJ.sfx.click();
    render(++step);
  };
  $("tofinal").onclick = () => {
    DJ.unlock(12); DJ.sfx.ok();
    document.body.classList.add("flash");
    setTimeout(() => location.href = "final.html", 420);
  };
  $("skip").onclick = e => {
    e.stopPropagation();
    DJ.unlock(12); DJ.sfx.click();
    location.href = "final.html";
  };

  /* 断点续玩：看过的人直接给入口，不再逼你重看一遍 */
  if (DJ.has("hisview_done")){
    lock = true;
    $("phone").style.opacity = .18;
    $("finalText").classList.add("show");
    document.querySelectorAll(".fl").forEach(f => f.classList.add("on"));
    $("tofinal").classList.add("show");
    $("skip").classList.add("show");
  } else {
    render(0);
  }

  DJ.envHint("这一页不用解。看着就行。", "hv1", 150);
}
</script>
</body>
</html>
