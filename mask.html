<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>第八楼 · 房间</title>
<link rel="stylesheet" href="assets/style.css?v=49">
<style>
  body{background:#05080f;overflow:hidden}
  .room{height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative}
  #mono{
    position:fixed;top:9%;left:50%;transform:translateX(-50%);width:min(560px,88vw);
    text-align:center;color:#c9d6ea;font-size:16.5px;letter-spacing:2px;line-height:2.1;
    min-height:72px;text-shadow:0 0 20px rgba(7,13,24,.9);transition:opacity .6s;white-space:pre-line;
  }
  #mono.fade{opacity:0}
  #maskWrap{cursor:pointer;user-select:none;transition:transform .3s;position:relative;z-index:2}
  #maskWrap:hover{transform:scale(1.02)}
  #maskWrap:active{transform:scale(.985)}
  /* 面具身后的微光：像有月光从高处落下来 */
  #maskGlow{
    position:absolute;left:50%;top:50%;width:420px;height:420px;transform:translate(-50%,-52%);
    background:radial-gradient(circle,rgba(174,191,216,.10) 0%,rgba(174,191,216,.035) 42%,transparent 70%);
    border-radius:50%;pointer-events:none;z-index:-1;animation:glowbreath 5s ease-in-out infinite;
  }
  @keyframes glowbreath{0%,100%{opacity:.7}50%{opacity:1}}
  /* 地面投影：把面具钉在"房间"里 */
  #maskShadow{
    position:absolute;left:50%;bottom:calc(50% - 178px);transform:translateX(-50%);
    width:170px;height:26px;border-radius:50%;
    background:radial-gradient(ellipse,rgba(0,0,0,.55) 0%,transparent 70%);
    pointer-events:none;z-index:1;filter:blur(2px);
  }
  /* 地板线：一条极淡的地平线，让空间有纵深 */
  .room::after{
    content:"";position:absolute;left:0;right:0;bottom:26%;height:1px;
    background:linear-gradient(90deg,transparent,rgba(28,44,74,.5) 30%,rgba(28,44,74,.5) 70%,transparent);
    pointer-events:none;
  }
  #crackText{
    position:fixed;bottom:120px;left:50%;transform:translateX(-50%);
    color:#42536f;font-size:12px;letter-spacing:4px;transition:color .6s;
  }
  #tray{
    position:fixed;bottom:44px;left:50%;transform:translateX(-50%);
    display:flex;gap:10px;min-height:44px;align-items:center;
  }
  .shard{
    width:52px;height:30px;background:#101c33;border:1px solid #223356;
    display:flex;align-items:center;justify-content:center;color:#8b9ab5;
    font-size:12px;letter-spacing:1px;transform:rotate(-2deg);opacity:0;
    animation:drop .7s ease forwards;
  }
  @keyframes drop{from{opacity:0;transform:translateY(-18px) rotate(8deg)}to{opacity:1;transform:rotate(-2deg)}}
  .shard:nth-child(even){transform:rotate(2deg)}
  #whisper{
    position:fixed;inset:0;display:none;align-items:center;justify-content:center;
    background:#0d1420;z-index:70;flex-direction:column;
  }
  #whisper.show{display:flex}
  #whisper .mir{
    width:170px;height:220px;border:4px solid #2c3a52;border-radius:6px;
    background:linear-gradient(135deg,#1a2436 0%,#0d1420 55%,#22314d 100%);
    position:relative;overflow:hidden;
  }
  #whisper .mir::after{
    content:"";position:absolute;inset:0;
    background:linear-gradient(115deg,transparent 30%,rgba(174,191,216,.16) 45%,transparent 60%);
  }
  #whisperText{margin-top:30px;color:#8b9ab5;letter-spacing:8px;opacity:0;transition:opacity 2.5s}
  #finalMirror{
    position:fixed;inset:0;display:none;align-items:center;justify-content:center;
    z-index:80;flex-direction:column;background:#05080f;
  }
  #finalMirror.show{display:flex}
  #finalMirror .mir{
    width:230px;height:300px;border:5px solid #2c3a52;border-radius:8px;
    background:linear-gradient(150deg,#141d30 0%,#0a1220 50%,#1c2a45 100%);
    display:flex;align-items:center;justify-content:center;flex-direction:column;
    position:relative;overflow:hidden;
  }
  #finalMirror .mir::after{
    content:"";position:absolute;inset:0;
    background:linear-gradient(115deg,transparent 25%,rgba(174,191,216,.14) 42%,transparent 58%);
  }
  #mirrorName{color:#e8edf5;letter-spacing:6px;font-size:19px;z-index:2}
  #mirrorSub{color:#42536f;font-size:11.5px;letter-spacing:3px;margin-top:10px;z-index:2}
  #crackBtn{
    margin-top:40px;opacity:0;transition:opacity 2s;pointer-events:none;
  }
  #crackBtn.on{opacity:1;pointer-events:auto}
  #layerCount{position:fixed;top:18px;left:22px;color:#33415e;font-size:11px;letter-spacing:2px}
</style>
</head>
<body>
<div class="moon"></div>
<div class="room">
  <div id="layerCount">0 / 8</div>
  <div id="mono"></div>

  <div id="maskWrap">
    <div id="maskGlow"></div>
    <div id="maskShadow"></div>
    <svg width="230" height="270" viewBox="0 0 230 270">
      <defs>
        <radialGradient id="mg" cx="40%" cy="35%">
          <stop offset="0%" stop-color="#22314d"/>
          <stop offset="100%" stop-color="#101827"/>
        </radialGradient>
      </defs>
      <g id="maskShape">
        <path d="M115 18 C58 18, 34 62, 38 122 C42 186, 78 244, 115 252 C152 244, 188 186, 192 122 C196 62, 172 18, 115 18 Z"
              fill="url(#mg)" stroke="#2c3a52" stroke-width="2"/>
        <ellipse id="eyeL" cx="84" cy="112" rx="17" ry="10" fill="#05080f"/>
        <ellipse id="eyeR" cx="146" cy="112" rx="17" ry="10" fill="#05080f"/>
        <path id="mouth" d="M92 178 Q115 192 138 178" stroke="#2c3a52" stroke-width="3" fill="none" stroke-linecap="round"/>
        <g id="cracks" opacity="0"></g>
      </g>
    </svg>
  </div>

  <div id="crackText">点 击 面 具</div>
  <div id="tray"></div>
</div>

<div id="whisper">
  <div class="mir"></div>
  <div id="whisperText">别 看 了</div>
</div>

<div id="finalMirror">
  <div class="mir">
    <div id="mirrorName"></div>
    <div id="mirrorSub">镜 中 人</div>
  </div>
  <button class="btn" id="crackBtn">面 具 碎 了 。 走 进 去</button>
</div>

<div id="envhint"></div>
<script src="assets/game.js?v=49"></script>
<script>
if (DJ.gate(9)) main();
function main(){
  DJ.unlock(9);
  const rvMask = DJ.revisit("mask");
  const $ = id => document.getElementById(id);

  /* 异变：第二次来，面具上已经有一道裂纹——你上次剥的 */
  if (rvMask >= 2){
    const c = document.createElement("div");
    c.style.cssText = "position:fixed;inset:0;pointer-events:none;z-index:15;";
    c.innerHTML = "<svg width='100%' height='100%' viewBox='0 0 100 100' preserveAspectRatio='none' style='opacity:.5'><path d='M 30 12 L 42 34 L 36 55 L 50 78' stroke='#05070c' stroke-width='0.8' fill='none'/><path d='M 42 34 L 55 40' stroke='#05070c' stroke-width='0.5' fill='none'/></svg>";
    document.body.appendChild(c);
    DJ.envHint("面具上有一道裂纹。你上次剥的。它没有长回去。", "mk_rv", 12);
  }

  const monologues = [
    "遇事不决，先列条件，再算概率。\n逻辑没有让我失望过。它也不会。",
    "「哈哈哈。」\n这两个字我打得比呼吸还熟练。",
    "我不回复，不是没看见。\n是看了十七遍。",
    "（第四层。面具后面没有脸。）",
    "我心软得没出息。\n别人随口一句好话，我记了三年。\n有人问，敏感是不是病。\n不是。那是把别人接不住的东西也接住了。重一点，正常。",
    "我试过用成绩、用赢、用别人眼里的『过得好』去填。\n全漏了。一点没剩。",
    "我没有病。\n我只是……只是……",
    "（第八层。）"
  ];
  const shards = ["你","找的","人，","从来","没有","存在","过","。"];
  let layer = 0;

  const eyeL = $("eyeL"), eyeR = $("eyeR");
  /* 眼睛会跟着鼠标（面具在看） */
  document.addEventListener("mousemove", e => {
    const dx = (e.clientX / window.innerWidth - .5) * 6;
    const dy = (e.clientY / window.innerHeight - .5) * 4;
    eyeL.setAttribute("cx", 84 + dx); eyeL.setAttribute("cy", 112 + dy);
    eyeR.setAttribute("cx", 146 + dx); eyeR.setAttribute("cy", 112 + dy);
  });

  function typeText(el, text, done){
    el.classList.remove("fade");
    el.textContent = "";
    let i = 0;
    const t = setInterval(() => {
      el.textContent = text.slice(0, ++i);
      if (i % 3 === 0) DJ.sfx.type();
      if (i >= text.length){ clearInterval(t); if (done) done(); }
    }, 34);
  }

  $("maskWrap").onclick = () => {
    layer++;
    $("layerCount").textContent = layer + " / 8";
    DJ.sfx.click();
    $("maskWrap").classList.add("shake"); setTimeout(()=>$("maskWrap").classList.remove("shake"), 420);

    /* 面具变化 */
    $("maskShape").style.opacity = String(1 - layer * 0.06);
    if (layer >= 3){
      const cracks = $("cracks");
      cracks.setAttribute("opacity", String(layer / 12));
      if (layer === 3){
        cracks.innerHTML =
          '<path d="M60 40 L80 90 L64 130" stroke="#3a5080" stroke-width="1.5" fill="none"/>' +
          '<path d="M170 60 L150 110 L168 150" stroke="#3a5080" stroke-width="1.5" fill="none"/>';
      }
      if (layer === 6){
        cracks.innerHTML +=
          '<path d="M115 18 L110 80 L124 140 L112 200" stroke="#4a7dd6" stroke-width="1.5" fill="none"/>' +
          '<path d="M40 150 L90 160 L140 150 L192 158" stroke="#3a5080" stroke-width="1.2" fill="none"/>';
      }
    }

    const m = $("mono");
    m.classList.add("fade");
    setTimeout(() => typeText(m, monologues[layer-1]), 500);

    /* 掉落碎片 */
    const sh = document.createElement("div"); sh.className = "shard";
    sh.textContent = shards[layer-1];
    $("tray").appendChild(sh);

    /* 第 4 层：轻微惊吓 */
    if (layer === 4){
      DJ.sfx.scare();
      const w = $("whisper"); w.classList.add("show");
      setTimeout(() => $("whisperText").style.opacity = 1, 700);
      setTimeout(() => { w.classList.remove("show"); $("whisperText").style.opacity = 0; }, 3200);
      DJ.flag("scare_1");
    }

    /* 第 7 层独白的犹豫 */
    if (layer === 7){
      setTimeout(() => {
        m.classList.add("glitch");
        m.innerHTML = "我没有病。<br>我只是<span style='color:#42536f'>……</span>";
      }, 2600);
    }

    /* 第 8 层：镜子 */
    if (layer === 8){
      setTimeout(() => {
        const fm = $("finalMirror"); fm.classList.add("show");
        $("mirrorName").textContent = DJ.state.name || "X";
        DJ.sfx.read();
        DJ.flag("saw_mirror"); DJ.addIncense(2);
        setTimeout(() => $("crackBtn").classList.add("on"), 2800);
      }, 1800);
    }
  };

  $("crackBtn").onclick = () => {
    DJ.sfx.ok(); DJ.unlock(10);
    document.body.classList.add("flash");
    setTimeout(() => location.href = "hub.html", 420);
  };

  /* 环境提示 */
  DJ.envHint("面具不重。一层一层来。别数错，是八层。", "mk1", 70);
  DJ.envHint("第四层有点晃眼。深呼吸就好。", "mk2", 170);

  DJ.injectDivine({
    clear:[ "上上签：一共八层。你没有别的事要做，只有这一件。",
            "上上签：碎片会自己拼。你只管剥。" ],
    poetic:["中平签：剥极而复，见天地心。", "中平签：面具后面的东西，比面具诚实。" ],
    empty:[ "下下签：手别抖。", "下下签：这层下面还是层。" ]
  });
}
</script>
</body>
</html>
